  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap');

:root {
  /* Surfaces */
  --bg-base: #0f0f0f;
  --bg-surface: #181818;
  --bg-raised: #212121;
  --bg-overlay: #2a2a2a;

  /* Borders */
  --border: #2e2e2e;
  --border-mid: #3a3a3a;
  --border-light: #4a4a4a;

  /* Text */
  --text-primary: #e8e4dc;
  --text-secondary: #8a8680;
  --text-muted: #565250;
  --text-dim: #3a3836;

  /* Amber */
  --amber: #E8A020;
  --amber-dim: #c07818;
  --amber-glow: rgba(232, 160, 32, 0.12);
  --amber-border: rgba(232, 160, 32, 0.3);

  /* Teal */
  --teal: #2ab8a0;
  --teal-dim: #1e8c7a;
  --teal-glow: rgba(42, 184, 160, 0.1);
  --teal-border: rgba(42, 184, 160, 0.3);

  /* Status */
  --ok: #4caf80;
  --warn: #e8a020;
  --danger: #e05050;
  --info: #5090e0;

  /* Type */
  --ui: 'Inter Tight', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;

  /* Motion */
  --t-fast: 120ms ease;
  --t-mid: 220ms ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(ellipse 1200px 800px at 12% 0%, rgba(232,160,32,0.02), transparent 55%),
    radial-gradient(ellipse 900px 700px at 100% 100%, rgba(42,184,160,0.018), transparent 55%);
  z-index: 0;
}

#root { position: relative; z-index: 1; height: 100vh; overflow: hidden; }

button, input, textarea { font-family: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ─── Type utilities ─── */
.mono { font-family: var(--mono); }
.label-10 { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.10em; color: var(--text-muted); }
.label-11 { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
.meta-10 { font-family: var(--mono); font-size: 10px; color: var(--text-secondary); }
.meta-11 { font-family: var(--mono); font-size: 11px; color: var(--text-secondary); }
.val-12  { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-primary); }
.val-22  { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.01em; }
.val-hero { font-family: var(--mono); font-size: 96px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1; }
.ui-13   { font-family: var(--ui); font-size: 13px; font-weight: 400; }
.ui-18   { font-family: var(--ui); font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }

/* ─── Animations ─── */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.pulse { animation: pulse 1.6s ease-in-out infinite; }

@keyframes blink {
  0%, 65% { opacity: 1; }
  70%, 100% { opacity: 0.15; }
}
.blink { animation: blink 1.2s steps(2, end) infinite; }

@keyframes drawLine {
  from { stroke-dashoffset: var(--dash-len, 2000); }
  to { stroke-dashoffset: 0; }
}
.draw-line {
  stroke-dasharray: var(--dash-len, 2000);
  stroke-dashoffset: var(--dash-len, 2000);
  animation: drawLine 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.45s ease-out both; }

@keyframes shimmer {
  from { background-position: -200% 0; }
  to { background-position: 200% 0; }
}
.shimmer {
  background: linear-gradient(90deg, var(--bg-raised) 25%, var(--bg-overlay) 50%, var(--bg-raised) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}

@keyframes flash {
  0% { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }
  100% { color: var(--text-primary); text-shadow: none; }
}
.flash { animation: flash 0.8s ease-out; }

@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ─── Bracket frame (corner crops, Expanse-style) ─── */
.frame {
  position: relative;
  padding: 16px;
}
.frame::before, .frame::after,
.frame > .frame-corner-bl, .frame > .frame-corner-br {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  border-color: var(--border-light);
  border-style: solid;
  border-width: 0;
  pointer-events: none;
}
.frame::before { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
.frame::after  { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
.frame > .frame-corner-bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
.frame > .frame-corner-br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
.frame--amber::before, .frame--amber::after,
.frame--amber > .frame-corner-bl, .frame--amber > .frame-corner-br { border-color: var(--amber-border); }

/* ─── Hover focus ring ─── */
.focus-ring { transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast); }

/* ─── Nav link ─── */
.nav-link {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 9px 14px 9px 16px;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-secondary);
  background: transparent;
  transition: color var(--t-fast), background var(--t-fast);
  text-align: left;
}
.nav-link:hover { color: var(--text-primary); background: var(--bg-raised); }
.nav-link.active {
  color: var(--amber);
  background: var(--amber-glow);
}
.nav-link.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--amber);
}
.nav-link .nav-id { color: var(--text-dim); margin-left: auto; font-size: 9px; }
.nav-link.active .nav-id { color: var(--amber-dim); }

/* ─── Status badge ─── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid var(--border-mid);
  color: var(--text-secondary);
}
.badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-glow); }
.badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-glow); }
.badge-ok     { color: var(--ok);    border-color: rgba(76,175,128,0.3); background: rgba(76,175,128,0.08); }
.badge-danger { color: var(--danger); border-color: rgba(224,80,80,0.3); background: rgba(224,80,80,0.08); }
.badge-muted  { color: var(--text-muted); border-color: var(--border); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ─── Toast ─── */
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast-stack {
  position: fixed; right: 16px; bottom: 16px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 2147483645;
  pointer-events: none;
}
.toast {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  min-width: 260px;
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.2s ease-out;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* ─── Sliding view transition ─── */
@keyframes viewIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.view-root { animation: viewIn 0.32s ease-out both; }

/* ─── Reusable event row ─── */
.event-row {
  display: grid;
  grid-template-columns: 80px 60px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 9px 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  transition: background var(--t-fast);
}
.event-row:hover { background: var(--bg-raised); }
.event-row .e-time { color: var(--text-muted); }
.event-row .e-code { color: var(--amber); letter-spacing: 0.08em; }
.event-row.system .e-code { color: var(--teal); }
.event-row .e-text { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-row .e-meta { color: var(--text-muted); }

/* ─── Hero pulse animation when fresh ─── */
@keyframes heroSettle {
  from { opacity: 0; transform: translateY(8px) scale(0.985); letter-spacing: -0.04em; }
  to { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -0.02em; }
}
.hero-settle { animation: heroSettle 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

/* Number flash on tick */
.tick-num { transition: color 80ms ease; }
.tick-num.tick-pulse { color: var(--amber); }

/* ─── Node type colors for DAG ─── */
:root {
  --node-state: #5090e0;
  --node-operator: #E8A020;
  --node-constraint: #e05050;
  --node-event: #9a7fb8;
  --node-operative: #2ab8a0;
  --node-time: #8a8680;
}

/* ─── DAG node base ─── */
.dag-node {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-primary);
  background: var(--bg-surface);
  border: 1px solid var(--border-mid);
  white-space: nowrap;
  cursor: pointer;
  transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
  user-select: none;
}
.dag-node:hover { transform: translate(-50%, -50%) scale(1.04) !important; z-index: 5; }
.dag-node--active {
  box-shadow: 0 0 0 1px currentColor, 0 0 12px currentColor;
  z-index: 4;
}
.dag-node--pulse::before {
  content: '';
  position: absolute; inset: -3px;
  border: 1px solid currentColor;
  border-radius: inherit;
  opacity: 0.35;
  animation: nodePulse 1.6s ease-out infinite;
}
@keyframes nodePulse {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Travel dot along edge */
@keyframes flowDot {
  from { offset-distance: 0%; }
  to   { offset-distance: 100%; }
}

/* Event log row enters from top */
@keyframes logIn {
  from { opacity: 0; transform: translateY(-6px); background: var(--amber-glow); }
  to   { opacity: 1; transform: translateY(0); background: transparent; }
}
.log-in { animation: logIn 0.6s ease-out both; }

/* ─── Modal ─── */
@keyframes modalFadeIn {
  from { opacity: 0; backdrop-filter: blur(0); }
  to   { opacity: 1; backdrop-filter: blur(6px); }
}
@keyframes modalSlideIn {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-scrim {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  animation: modalFadeIn 0.2s ease-out;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
}
.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  max-width: 720px;
  width: 100%;
  max-height: calc(100vh - 64px);
  display: flex; flex-direction: column;
  animation: modalSlideIn 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
  box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}

/* ─── Panel switch transition ─── */
@keyframes panelEnter {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.panel-enter { animation: panelEnter 0.34s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

/* ─── Highlight pulse ring (for card focus) ─── */
@keyframes highlightRing {
  0%   { box-shadow: 0 0 0 0 var(--amber-border); }
  100% { box-shadow: 0 0 0 8px transparent; }
}
.highlight-ring { animation: highlightRing 0.9s ease-out; }

/* ─── Card hover lift ─── */
.lift {
  transition: transform var(--t-fast), border-color var(--t-fast), background var(--t-fast);
}
.lift:hover {
  border-color: var(--border-light);
  background: var(--bg-raised);
}

/* ─── Terminal ─── */
.terminal {
  font-family: var(--mono);
  font-size: 12px;
  background: #000;
  color: var(--text-primary);
  padding: 14px;
  border-radius: var(--radius-sm);
  overflow-y: auto;
}
.terminal .t-prompt { color: var(--amber); }
.terminal .t-ok { color: var(--ok); }
.terminal .t-err { color: var(--danger); }
.terminal .t-meta { color: var(--text-muted); }
.terminal .t-line { white-space: pre; line-height: 1.55; }

@keyframes cursorBlink { 50% { opacity: 0; } }
.t-cursor {
  display: inline-block;
  width: 7px; height: 13px;
  background: var(--amber);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: cursorBlink 1s steps(2, end) infinite;
}

/* ─── Mobile (Orchie) ─── */
.bubble {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  border-left: 2px solid var(--amber);
}
.bubble-user {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  border-left: none;
  align-self: flex-end;
  max-width: 78%;
}

/* ─── Density tweak hook ─── */
[data-density="compact"] { --pad-y: 8px; --pad-x: 12px; }
[data-density="regular"] { --pad-y: 12px; --pad-x: 16px; }
[data-density="comfy"]   { --pad-y: 16px; --pad-x: 20px; }

/* Hide scrollbar utility (still scrollable) */
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

  </style>
</head>

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark

        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────

/* Sustena — core primitives: logo, icons, frames, badges, hero readouts */



/* ───────────────────────────────────────────────────────────
   LOGO — network node (center disc + 3 branching arcs)
   ─────────────────────────────────────────────────────────── */
function SustenaMark({ size = 18, primary = 'var(--amber)', secondary = 'var(--text-primary)', mono = false }) {
  const a = mono ? secondary : primary;
  const c = secondary;
  const endX = 78 * Math.cos((28 * Math.PI) / 180);
  const endY = 78 * Math.sin((28 * Math.PI) / 180);
  const branchPath = `M 0 0 Q 52 0 ${endX} ${endY}`;
  return (
    <svg width={size} height={size} viewBox="-100 -100 200 200" style={{ display: 'block' }}>
      {[-90, 30, 150].map(r => (
        <g key={r} transform={`rotate(${r})`}>
          <path d={branchPath} stroke={c} strokeWidth="14" fill="none" strokeLinecap="round" />
          <circle cx={endX} cy={endY} r="11" fill={c} />
        </g>
      ))}
      <circle cx="0" cy="0" r="22" fill={a} />
    </svg>
  );
}

function SustenaLogo({ size = 16, gap = 8 }) {
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap }}>
      <SustenaMark size={size} />
      <span style={{
        fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 500,
        letterSpacing: '0.08em', textTransform: 'uppercase',
        color: 'var(--text-primary)', lineHeight: 1,

      </span>
    </div>
  );
}

/* ───────────────────────────────────────────────────────────
   ICONS — line set

function Icon({ name, size = 14 }) {

  switch (name) {
    case 'pulse':    return <svg {...s} viewBox="0 0 16 16"><path d="M1 8h3l2-5 3 10 2-5h4" /></svg>;
    case 'ledger':   return <svg {...s} viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" /><path d="M5 5h6M5 8h6M5 11h4" /></svg>;
    case 'council':  return <svg {...s} viewBox="0 0 16 16"><circle cx="5" cy="5.5" r="1.6" /><circle cx="11" cy="5.5" r="1.6" /><path d="M2 13c0-2 1.4-3.5 3-3.5s3 1.5 3 3.5" /><path d="M8 13c0-2 1.4-3.5 3-3.5s3 1.5 3 3.5" /></svg>;
    case 'leaf':     return <svg {...s} viewBox="0 0 16 16"><path d="M3 13c0-6 4-10 10-10 0 6-4 10-10 10z" /><path d="M3 13c2-2 4-4 7-6" /></svg>;
    case 'agent':    return <svg {...s} viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="9" rx="1.5" /><circle cx="6.5" cy="8.5" r="0.8" fill="currentColor" stroke="none" /><circle cx="9.5" cy="8.5" r="0.8" fill="currentColor" stroke="none" /><path d="M8 4V2M6 2h4" /></svg>;
    case 'vault':    return <svg {...s} viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" /><circle cx="8" cy="8" r="2.5" /><path d="M8 5.5v0.5M8 10v0.5M5.5 8h0.5M10 8h0.5" /></svg>;
    case 'settings': return <svg {...s} viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3 3l1.5 1.5M11.5 11.5L13 13M3 13l1.5-1.5M11.5 4.5L13 3" /></svg>;
    case 'send':     return <svg {...s} viewBox="0 0 16 16"><path d="M14 2L2 7l5 2 2 5z" /></svg>;
    case 'arrow-up':   return <svg {...s} viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" /></svg>;
    case 'arrow-down': return <svg {...s} viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4" /></svg>;
    case 'chevron':  return <svg {...s} viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" /></svg>;
    case 'check':    return <svg {...s} viewBox="0 0 16 16"><path d="M3 8.5L6.5 12 13 4.5" /></svg>;
    case 'x':        return <svg {...s} viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>;
    case 'plus':     return <svg {...s} viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>;
    case 'expand':   return <svg {...s} viewBox="0 0 16 16"><path d="M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3" /></svg>;
    case 'replay':   return <svg {...s} viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 5-5" /><path d="M3 3v3h3" /></svg>;
    case 'crosshair': return <svg {...s} viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" /><path d="M8 1v3M8 12v3M1 8h3M12 8h3" /></svg>;
    case 'warning':  return <svg {...s} viewBox="0 0 16 16"><path d="M8 2l6.5 11h-13z" /><path d="M8 6v3.5M8 11.5v0.5" /></svg>;
    case 'dot':      return <svg {...s} viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="currentColor" stroke="none" /></svg>;
    default: return null;
  }
}

/* ───────────────────────────────────────────────────────────
   PULSE TICK — tiny live number with flash
   ─────────────────────────────────────────────────────────── */
function LiveNum({ value, prev }) {
  const [flash, setFlash] = useState(false);
  useEffect(() => {
    if (prev != null && prev !== value) {
      setFlash(true);
      const t = setTimeout(() => setFlash(false), 600);
      return () => clearTimeout(t);
    }
  }, [value]);
  return (
    <span className={`tick-num ${flash ? 'tick-pulse' : ''}`}>{value}</span>
  );
}

/* ───────────────────────────────────────────────────────────
   SPARKLINE
   ─────────────────────────────────────────────────────────── */
function Spark({ series, w = 100, h = 28, color = 'var(--text-secondary)', dot = true, animate = true }) {
  const min = Math.min(...series);
  const max = Math.max(...series);
  const range = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x},${y}`;
  }).join(' ');
  const last = series[series.length - 1];
  const lastY = h - ((last - min) / range) * h;
  return (
    <svg width={w} height={h} style={{ overflow: 'visible' }}>
      <polyline
        points={pts} fill="none" stroke={color} strokeWidth="1.2"
        className={animate ? 'draw-line' : undefined}
        style={{ '--dash-len': w * 3 }}
      />
      {dot && <circle cx={w} cy={lastY} r="2" fill={color} />}
    </svg>
  );
}

/* ───────────────────────────────────────────────────────────
   AREA CHART
   ─────────────────────────────────────────────────────────── */
function AreaChart({ series, w = 600, h = 160, color = 'var(--amber)', fill = 'var(--amber-glow)', animate = true, axis = true }) {
  if (!series || series.length < 2) return null;
  const min = 0;
  const max = Math.max(...series) * 1.1;
  const range = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return [x, y];
  });
  const linePath = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x} ${y}`).join(' ');
  const areaPath = `M 0 ${h} ` + pts.map(([x, y]) => `L ${x} ${y}`).join(' ') + ` L ${w} ${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" width="100%" height="100%" style={{ display: 'block', overflow: 'visible' }}>
      {axis && [0.25, 0.5, 0.75].map(p => (
        <line key={p} x1="0" y1={h * p} x2={w} y2={h * p} stroke="var(--border)" strokeDasharray="2 4" strokeWidth="0.5" />
      ))}
      <path d={areaPath} fill={fill} className={animate ? 'fade-up' : undefined} style={{ animationDelay: '0.6s', animationFillMode: 'both', opacity: animate ? 0 : 1, ...(animate ? { animation: 'fadeUp 0.6s ease-out 0.6s forwards' } : {}) }} />
      <path d={linePath} fill="none" stroke={color} strokeWidth="1.4"
        className={animate ? 'draw-line' : undefined}
        style={{ '--dash-len': w * 3 }}
      />
      {/* End marker */}
      <circle
        cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="3"
        fill={color}
        style={{ opacity: animate ? 0 : 1, animation: animate ? 'fadeUp 0.3s ease-out 1.4s forwards' : undefined }}
      />
    </svg>
  );
}

/* ───────────────────────────────────────────────────────────
   PERSONA HEADER
   ─────────────────────────────────────────────────────────── */
function PersonaHeader({ persona, cycle }) {
  return (

/* ─── Typewriter hook ──────────────────────────────────────
   Progressively reveals text characters at given speed (chars/tick).
*/
function useTypewriter(text, speed = 30, onDone) {
  const [shown, setShown] = oUseState('');
  const doneRef = oUseRef(false);
  oUseEffect(() => {
    setShown('');
    doneRef.current = false;
    if (!text) return;
    let i = 0;
    const interval = setInterval(() => {
      i += Math.max(1, Math.floor(speed / 12));
      if (i >= text.length) {
        setShown(text);
        clearInterval(interval);
        if (!doneRef.current) { doneRef.current = true; onDone?.(); }
      } else {
        setShown(text.slice(0, i));
      }
    }, 16);
    return () => clearInterval(interval);
  }, [text, speed]);
  return shown;
}

function PieWidget({ data, size }) {
  const total = data.slices.reduce((s, x) => s + x.value, 0);
  const dim = size === 'sm' ? 88 : 120;
  const r = dim / 2 - 6;
  const cx = dim / 2, cy = dim / 2;
  const inner = r * 0.55;

  // Compute arcs
  let acc = 0;
  const arcs = data.slices.map(s => {
    const start = (acc / total) * 2 * Math.PI;
    acc += s.value;
    const end = (acc / total) * 2 * Math.PI;
    return { ...s, start, end };
  });

  const pathArc = (a) => {
    const x1 = cx + r * Math.cos(a.start - Math.PI / 2);
    const y1 = cy + r * Math.sin(a.start - Math.PI / 2);
    const x2 = cx + r * Math.cos(a.end - Math.PI / 2);
    const y2 = cy + r * Math.sin(a.end - Math.PI / 2);
    const xi2 = cx + inner * Math.cos(a.end - Math.PI / 2);
    const yi2 = cy + inner * Math.sin(a.end - Math.PI / 2);
    const xi1 = cx + inner * Math.cos(a.start - Math.PI / 2);
    const yi1 = cy + inner * Math.sin(a.start - Math.PI / 2);
    const large = a.end - a.start > Math.PI ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${inner} ${inner} 0 ${large} 0 ${xi1} ${yi1} Z`;
  };

  return (
    <div style={{
      background: 'var(--bg-surface)', border: '1px solid var(--border)',
      borderRadius: 'var(--radius-md)', padding: size === 'sm' ? '10px 12px' : '14px 16px',
      display: 'flex', gap: 14, alignItems: 'center',
    }}>
      <div style={{ position: 'relative', flexShrink: 0 }}>
        <svg width={dim} height={dim}>
          {arcs.map((a, i) => (
            <path
              key={i}
              d={pathArc(a)}
              fill={a.color}
              style={{
                opacity: 0,
                animation: `fadeUp 0.4s ease-out ${0.15 + i * 0.08}s forwards`,
                transformOrigin: `${cx}px ${cy}px`,
              }}
            />
          ))}
        </svg>
        <div style={{
          position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', pointerEvents: 'none',
        }}>
          <span className="label-10" style={{ fontSize: 8 }}>TOTAL</span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: size === 'sm' ? 10 : 12, fontWeight: 500, color: 'var(--text-primary)' }}>{data.total}</span>
        </div>
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 4, minWidth: 0 }}>
        {data.slices.map((s, i) => (
          <div key={i} className="fade-up" style={{
            display: 'grid', gridTemplateColumns: '8px 1fr auto', gap: 8, alignItems: 'center',
            animationDelay: `${0.25 + i * 0.06}s`,
          }}>
            <span style={{ width: 7, height: 7, background: s.color, borderRadius: 1 }} />
            <span style={{ fontFamily: 'var(--ui)', fontSize: 11, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.label}</span>
            <span className="val-12" style={{ fontSize: 10, color: 'var(--text-secondary)' }}>{s.value}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function LineWidget({ data, size }) {
  const W = size === 'sm' ? 280 : 360;
  const H = size === 'sm' ? 80 : 100;
  const series = data.series;
  const min = Math.min(...series, data.threshold || Infinity) * 0.9;
  const max = Math.max(...series, data.threshold || -Infinity) * 1.05;
  const range = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * (W - 24) + 12;
    const y = H - ((v - min) / range) * H + 8;
    return [x, y];
  });
  const linePath = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x} ${y}`).join(' ');
  const lastY = pts[pts.length - 1][1];
  const lastX = pts[pts.length - 1][0];
  const thrY = data.threshold ? (H - ((data.threshold - min) / range) * H + 8) : null;

  return (
    <div style={{
      background: 'var(--bg-surface)', border: '1px solid var(--border)',
      borderRadius: 'var(--radius-md)', padding: size === 'sm' ? '10px 12px' : '14px 16px',
      display: 'flex', flexDirection: 'column', gap: 6,
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
        <span className="label-10">BURN RATE · LAST 12 DAYS</span>
        <span className="val-12" style={{ fontSize: 11, color: 'var(--amber)' }}>{series[series.length - 1].toLocaleString()} {data.unit}</span>
      </div>
      <svg width={W} height={H + 18} style={{ overflow: 'visible' }}>
        {/* Threshold line */}
        {thrY != null && (
          <>
            <line x1="0" y1={thrY} x2={W} y2={thrY} stroke="var(--danger)" strokeDasharray="2 3" strokeWidth="1" opacity="0.6" />
            <text x={W - 4} y={thrY - 4} textAnchor="end" fontFamily="DM Mono" fontSize="9" fill="var(--danger)">CEILING {data.threshold}</text>
          </>
        )}
        {/* Area */}
        <path
          d={`${linePath} L ${lastX} ${H + 8} L 12 ${H + 8} Z`}
          fill="var(--amber-glow)"
          style={{ opacity: 0, animation: 'fadeUp 0.5s ease-out 0.4s forwards' }}
        />
        {/* Line */}
        <path d={linePath} fill="none" stroke="var(--amber)" strokeWidth="1.4"
          className="draw-line"
          style={{ '--dash-len': W * 3, animationDuration: '1s' }}
        />
        {/* End dot */}
        <circle cx={lastX} cy={lastY} r="3" fill="var(--amber)"
          style={{ opacity: 0, animation: 'fadeUp 0.3s ease-out 1.1s forwards' }}
        />
        {/* Labels */}
        {data.labels?.map((l, i) => {
          if (!l) return null;
          const x = (i / (series.length - 1)) * (W - 24) + 12;
          return <text key={i} x={x} y={H + 18} textAnchor="middle" fontFamily="DM Mono" fontSize="9" fill="var(--text-muted)">{l}</text>;
        })}
      </svg>
    </div>
  );
}

    case 'pie':      return <PieWidget data={widget.data} size={size} />;
    case 'line':     return <LineWidget data={widget.data} size={size} />;
    case 'mpesa':    return <MpesaWidget data={widget.data} size={size} />;
    case 'alert':    return <AlertWidget data={widget.data} size={size} />;

/* Streamed conversation hook — plays scripted messages with delays */
function useStreamedConversation(script, autoStart = true, baseDelay = 1200) {
  const [shown, setShown] = oUseState([]);
  const [thinking, setThinking] = oUseState(false);
  const idxRef = oUseRef(0);

  const playNext = () => {
    if (idxRef.current >= script.length) return;
    setThinking(true);
    const msg = script[idxRef.current];
    const thinkTime = 400 + Math.random() * 600;
    setTimeout(() => {
      setThinking(false);
      setShown(s => [...s, msg]);
      idxRef.current += 1;
    }, thinkTime);
  };

  // Auto-start sequence
  oUseEffect(() => {
    if (!autoStart) return;
    if (shown.length === 0 && idxRef.current === 0) {
      const t0 = setTimeout(() => playNext(), 600);
      return () => clearTimeout(t0);
    }
  }, []);

  const onMessageDone = () => {
    setTimeout(() => playNext(), baseDelay);
  };

  const send = (text) => {
    setShown(s => [...s, { role: 'user', text }]);
    setThinking(true);
    setTimeout(() => {
      setThinking(false);
      // Loop back to a relevant assistant reply
      const reply = pickReply(text);
      setShown(s => [...s, reply]);
    }, 900 + Math.random() * 800);
  };

  const restart = () => {
    setShown([]);
    idxRef.current = 0;
    setThinking(false);
    setTimeout(() => playNext(), 400);
  };

  return { messages: shown, thinking, onMessageDone, send, restart };
}

function pickReply(text) {
  const t = text.toLowerCase();
  if (t.includes('budget') || t.includes('pocket')) {
    return {
      role: 'assistant',
      text: "Here's the pocket breakdown again, with overspend flagged in amber:",
      widget: { type: 'pie', data: ORCHIE_DEMO[2].widget.data },
    };
  }
  if (t.includes('burn') || t.includes('rate')) {
    return {
      role: 'assistant',
      text: "Burn rate over the last 12 days — we're 6% under ceiling but trending up:",
      widget: { type: 'line', data: ORCHIE_DEMO[3].widget.data },
    };
  }
  if (t.includes('reall') || t.includes('move') || t.includes('reallocate')) {
    return {
      role: 'assistant',
      text: "Simulated. Moving KSH 400k from Treasury Ops → Carbon-R&D keeps you 6.1% above the council floor and unblocks two grants by 9 days. Draft as SUS-0149?",
      widget: { type: 'proposal', data: { ...ORCHIE_DEMO[6].widget.data, id: 'SUS-0149 (DRAFT)', title: 'Reallocate −KSH 400k Ops → Carbon-R&D', for: 0, against: 0, abstain: 0, eta: 'NOT QUEUED' } },
    };
  }
  if (t.includes('cash') || t.includes('position')) {
    return {
      role: 'assistant',
      text: 'Right now:',
      widget: { type: 'metric', data: ORCHIE_DEMO[1].widget.data },
    };
  }
  return {
    role: 'assistant',
    text: "Pulling that — I'll need a moment to simulate the dependency chain. Should I surface the impact on Q3 cap, or just the headline number?",
  };
}
