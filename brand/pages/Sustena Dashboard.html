function ScenarioTree({ tree, selected, onSelect, depth = 0 }) {
  return (
    <div style={{ padding: '6px 0' }}>
      {tree.map(n => (
        <ScenarioNode key={n.id} n={n} selected={selected} onSelect={onSelect} depth={depth} />
      ))}
    </div>
  );
}

function ScenarioNode({ n, selected, onSelect, depth }) {
  const isLeaf = !n.children;
  const isActive = selected === n.id;
  const isHot = n.hot;
  return (
    <div>
      <button
        onClick={() => onSelect(n.id)}
        className="fade-up"
        style={{
          width: '100%', textAlign: 'left',
          display: 'flex', alignItems: 'center', gap: 6,
          padding: `7px ${12 + depth * 14}px 7px ${12 + depth * 14}px`,
          background: isActive ? 'var(--amber-glow)' : 'transparent',
          borderLeft: isActive ? '2px solid var(--amber)' : '2px solid transparent',
          transition: 'background var(--t-fast)',
        }}
        onMouseEnter={e => !isActive && (e.currentTarget.style.background = 'var(--bg-raised)')}
        onMouseLeave={e => !isActive && (e.currentTarget.style.background = 'transparent')}
      >
        <span style={{ color: 'var(--text-dim)', fontFamily: 'var(--mono)', fontSize: 9 }}>
          {n.children ? '▾' : '·'}
        </span>
        <span style={{
          fontFamily: 'var(--mono)', fontSize: 10,
          color: isActive ? 'var(--amber)' : (isHot ? 'var(--text-primary)' : 'var(--text-secondary)'),
          flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>{n.label}</span>
        {n.score != null && (
          <span style={{
            fontFamily: 'var(--mono)', fontSize: 9,
            color: n.score >= 0.8 ? 'var(--teal)' : n.score >= 0.6 ? 'var(--amber)' : 'var(--text-muted)',
            background: 'var(--bg-base)',
            padding: '1px 5px', borderRadius: 8,
          }}>{n.score.toFixed(2)}</span>
        )}
      </button>
      {n.children && <ScenarioTree tree={n.children} selected={selected} onSelect={onSelect} depth={depth + 1} />}
    </div>
  );
}

/* The animated DAG canvas */
function SimulatorCanvas({

  orchieOpen, codeEditorOpen,
  selectedOperator, onCloseOrchie, onCloseCodeEditor,
  tick = 0,
}) {

        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.4)),
        linear-gradient(0deg, var(--bg-base) 0%, var(--bg-surface) 100%)
      `,
    }}>
      {/* Grid */}
      <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>

              key={n.id}
              node={n}
              active={activeNodes.has(n.id) || completedNodes.has(n.id)}
              pulse={activeNodes.has(n.id) && !completedNodes.has(n.id)}
              onOrchieExpand={onOrchieExpand}
              onClick={onOperatorClick}
            />
          ))}
        </div>
      </div>

        <span className="meta-10" style={{ color: 'var(--text-muted)' }}>T+ {(activeNodes.size + completedNodes.size) * 1.4} s</span>
        <span className="meta-10" style={{ color: 'var(--text-muted)' }}>OPS · {completedNodes.size} / {SIM_NODES.length}</span>
      </div>
      <div style={{ position: 'absolute', bottom: 12, right: 14, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
        <span className="meta-10" style={{ color: 'var(--amber)' }}>ACTIVE · {activeNodes.size}</span>
        <span className="meta-10" style={{ color: 'var(--teal)' }}>COMPLETED · {completedNodes.size}</span>
      </div>

      {/* Step 4: Orchie expansion panel — slides in from right */}
      <OrchieExpansionPanel
        open={orchieOpen}
        onClose={onCloseOrchie}
        tick={tick}

      {/* Step 6: Code editor — slides up from bottom */}
      {codeEditorOpen && selectedOperator && (
        <CodeEditor
          operatorNode={selectedOperator}
          onClose={onCloseCodeEditor}
        />
      )}
    </div>
  );
}

    "pocket_name": "string",

  },

    "sub_operator": "ui.render.operator_card",

  }

  python: `def budget_allocate_fn(state, inputs):
    """Allocate budget to a named pocket."""
    pocket = inputs["pocket_name"]
    amount = inputs["amount"]
    period = inputs["period"]

    if pocket not in state["pockets"]:
        raise ValueError(f"Unknown pocket: {pocket}")

    current = state["pockets"][pocket]["balance"]
    if amount > current:
        raise ConstraintError("balance_constraint")

    state["pockets"][pocket]["balance"] -= amount
    state["pockets"][pocket]["allocated"] += amount
    return state`,
};

function CornerCrop({ pos }) {
  const styles = {
    tl: { top: -1, left: -1, borderTopWidth: 1, borderLeftWidth: 1 },
    tr: { top: -1, right: -1, borderTopWidth: 1, borderRightWidth: 1 },
    bl: { bottom: -1, left: -1, borderBottomWidth: 1, borderLeftWidth: 1 },
    br: { bottom: -1, right: -1, borderBottomWidth: 1, borderRightWidth: 1 },
  }[pos];
  return <span style={{
    position: 'absolute', width: 7, height: 7,
    borderStyle: 'solid', borderColor: 'var(--amber)', borderWidth: 0,
    ...styles,
    pointerEvents: 'none',
  }} />;
}

/* Knob — rotational dial. Drag vertically to change. */
function Knob({ value, min, max, step = 1, unit, color = 'var(--amber)', onChange, note }) {
  const dragRef = dUseRef(null);
  const startRef = dUseRef({ y: 0, v: value });

  const pct = (value - min) / (max - min);
  const angle = -135 + pct * 270;

  const onDown = (e) => {
    startRef.current = { y: e.clientY, v: value };
    const onMove = (ev) => {
      const dy = startRef.current.y - ev.clientY;
      const range = max - min;
      const newVal = Math.max(min, Math.min(max, startRef.current.v + Math.round((dy / 120) * range / step) * step));
      onChange?.(newVal);
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const size = 110;
  const ringR = size / 2 - 8;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
      <div ref={dragRef} onMouseDown={onDown} style={{
        position: 'relative', width: size, height: size, cursor: 'ns-resize', userSelect: 'none',
      }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: 'visible' }}>
          {/* Dim track arc */}
          <circle cx={size/2} cy={size/2} r={ringR}
            fill="none" stroke="var(--border)" strokeWidth="2"
            strokeDasharray={`${2 * Math.PI * ringR * 0.75} 999`}
            transform={`rotate(135 ${size/2} ${size/2})`}
            strokeLinecap="round"
          />
          {/* Active arc */}
          <circle cx={size/2} cy={size/2} r={ringR}
            fill="none" stroke={color} strokeWidth="2.4"
            strokeDasharray={`${2 * Math.PI * ringR * 0.75 * pct} 999`}
            transform={`rotate(135 ${size/2} ${size/2})`}
            strokeLinecap="round"
            style={{ filter: `drop-shadow(0 0 4px ${color})` }}
          />
          {/* Tick marks */}
          {Array.from({ length: 11 }).map((_, i) => {
            const a = -135 + (i / 10) * 270;
            const rad = (a * Math.PI) / 180;
            const ri = ringR - 6;
            const ro = ringR - 2;
            return <line key={i}
              x1={size/2 + ri * Math.cos(rad)} y1={size/2 + ri * Math.sin(rad)}
              x2={size/2 + ro * Math.cos(rad)} y2={size/2 + ro * Math.sin(rad)}
              stroke="var(--border-mid)"
              strokeWidth={i % 5 === 0 ? 1.2 : 0.8}
            />;
          })}
          {/* Indicator tab on the active arc */}
          <circle
            cx={size/2 + ringR * Math.cos((angle * Math.PI) / 180)}
            cy={size/2 + ringR * Math.sin((angle * Math.PI) / 180)}
            r="3.5" fill={color}
            style={{ filter: `drop-shadow(0 0 4px ${color})` }}
          />
        </svg>
        {/* Center stack */}
        <div style={{
          position: 'absolute', inset: 0, display: 'flex',
          flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          pointerEvents: 'none',
        }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 28, fontWeight: 500, color: 'var(--text-primary)', letterSpacing: '-0.02em', lineHeight: 1 }}>
            {value}<span style={{ fontSize: 14, color: 'var(--text-secondary)', marginLeft: 2 }}>{unit}</span>
          </span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-muted)', letterSpacing: '0.1em', marginTop: 3 }}>
            Threshold-α
          </span>
        </div>
      </div>
      {note && <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color, letterSpacing: '0.12em' }}>{note}</span>}
    </div>
  );
}

/* Horizontal slider with LIMIT marker + parameter subscript */
function Slider({ label, param, value, min, max, step = 1, unit, color = 'var(--amber)', onChange, fmt, limit }) {
  const pct = (value - min) / (max - min);
  const limitPct = limit ? (limit.value - min) / (max - min) : null;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
        <div style={{ display: 'flex', flexDirection: 'column' }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-muted)', letterSpacing: '0.12em' }}>{label}</span>
          {param && <span style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-dim)', letterSpacing: '0.06em' }}>{param}</span>}
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 18, fontWeight: 500, color: 'var(--text-primary)', letterSpacing: '-0.01em' }}>{fmt ? fmt(value) : value}</span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)' }}>{unit}</span>
        </div>
      </div>
      <div style={{ position: 'relative', height: 18 }}>
        {/* Track */}
        <div style={{
          position: 'absolute', left: 0, right: 0, top: '50%', transform: 'translateY(-50%)',
          height: 3, background: 'var(--bg-base)', borderRadius: 1.5, border: '1px solid var(--border)',
        }}>
          <div style={{ width: `${pct * 100}%`, height: '100%', background: color, borderRadius: 1.5, boxShadow: `0 0 4px ${color}` }} />
        </div>
        {/* Tick marks */}
        {[0, 0.25, 0.5, 0.75, 1].map(p => (
          <span key={p} style={{
            position: 'absolute', left: `${p * 100}%`, top: '50%',
            width: 1, height: p % 0.5 === 0 ? 8 : 5, background: 'var(--border-mid)',
            transform: 'translate(-0.5px, -50%)',
          }} />
        ))}
        {/* Limit marker */}
        {limitPct != null && (
          <>
            <span style={{
              position: 'absolute', left: `${limitPct * 100}%`, top: '50%',
              width: 1, height: 12, background: 'var(--danger)',
              transform: 'translate(-0.5px, -50%)',
            }} />
            <span style={{
              position: 'absolute', left: `${limitPct * 100}%`, top: -2,
              transform: 'translateX(-50%)',
              fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--danger)', letterSpacing: '0.08em',
              whiteSpace: 'nowrap',
            }}>▼{limit.label}</span>
          </>
        )}
        {/* Native input (overlaid) */}
        <input type="range"
          value={value} min={min} max={max} step={step}
          onChange={e => onChange?.(Number(e.target.value))}
          style={{
            position: 'absolute', inset: 0, opacity: 0, cursor: 'ew-resize',
            width: '100%', height: '100%', margin: 0,
          }}
        />
        {/* Thumb */}
        <div style={{
          position: 'absolute', left: `${pct * 100}%`, top: '50%',
          transform: 'translate(-50%, -50%)',
          width: 12, height: 12, borderRadius: '50%',
          background: 'var(--bg-base)', border: `2px solid ${color}`,
          boxShadow: `0 0 6px ${color}`,
          pointerEvents: 'none',
        }} />
      </div>
    </div>
  );

/* Stepper — discrete value with − / N / + */

/* Vertical scale — meter with ceiling marker */
function VerticalScale({ label, param, value, min, max, ceiling, unit, tick }) {
  const pct = Math.min(1, (value - min) / (max - min));
  const ceilPct = ceiling ? Math.min(1, (ceiling - min) / (max - min)) : null;
  const over = ceiling && value > ceiling;
  const color = over ? 'var(--danger)' : value > (ceiling || max) * 0.85 ? 'var(--amber)' : 'var(--teal)';
  const wobble = Math.sin(tick * 0.4) * 0.01;
  const livePct = Math.max(0, Math.min(1, pct + wobble));

  const H = 70;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-muted)', letterSpacing: '0.12em' }}>{label}</span>

          {[0, 50, 100].map(p => (
            <span key={p} style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-muted)' }}>{p}</span>
          ))}
        </div>
        <div style={{
          position: 'relative',
          width: 16, height: H,
          background: 'var(--bg-base)',
          border: '1px solid var(--border-mid)',
          borderRadius: 1,
          overflow: 'hidden',
        }}>
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            height: `${livePct * 100}%`, background: color,
            transition: 'height 0.4s ease',
            boxShadow: `0 0 6px ${color}`,
          }} />
          {ceilPct != null && (
            <span style={{
              position: 'absolute', left: -2, right: -2, bottom: `${ceilPct * 100}%`,
              height: 1, background: 'var(--danger)',
            }} />
          )}
        </div>
      </div>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 500, color }}>{value.toLocaleString()}</span>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-muted)' }}>{unit}</span>
      {param && <span style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-dim)', letterSpacing: '0.06em' }}>{param}</span>}
    </div>
  );
}

/* Big alert dial — centerpiece. Concentric ring with LEVEL readout. */
function BigDial({ value, level, tick }) {
  const size = 130;
  const cx = size / 2, cy = size / 2;
  const r = size / 2 - 10;
  // Map 0-100 to -225° to +45° (3/4 turn) starting from lower-left
  const startAngle = 135; // degrees, CSS / SVG convention (3 o'clock = 0)
  const sweep = 270;
  const pct = Math.min(1, Math.max(0, value / 100));
  const endAngle = startAngle + sweep * pct;
  // Arc path
  const polar = (angDeg, radius) => {
    const a = (angDeg - 90) * Math.PI / 180;
    return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
  };
  const [sx, sy] = polar(startAngle, r);
  const [ex, ey] = polar(endAngle, r);
  const [trackEx, trackEy] = polar(startAngle + sweep, r);
  const largeArc = sweep * pct > 180 ? 1 : 0;
  const trackPath = `M ${sx} ${sy} A ${r} ${r} 0 1 1 ${trackEx} ${trackEy}`;
  const activePath = pct > 0 ? `M ${sx} ${sy} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey}` : '';

  const c = level === 'HIGH' ? 'var(--amber)' : level === 'MED' ? 'var(--teal)' : 'var(--info)';
  // Live wobble on tick marks
  const tickActive = (tick % 8);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
      <div style={{ position: 'relative', width: size, height: size }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: 'visible' }}>
          {/* Outer track */}
          <path d={trackPath} fill="none" stroke="var(--border)" strokeWidth="2.5" strokeLinecap="round" />
          {/* Active arc */}
          {activePath && <path d={activePath} fill="none" stroke={c} strokeWidth="3"
            strokeLinecap="round" style={{ filter: `drop-shadow(0 0 6px ${c})` }}
          />}
          {/* Inner ring tick marks */}
          {Array.from({ length: 18 }).map((_, i) => {
            const ang = startAngle + (sweep / 18) * i;
            const [x1, y1] = polar(ang, r - 12);
            const [x2, y2] = polar(ang, r - 8);
            const isActive = i === tickActive;
            return <line key={i}
              x1={x1} y1={y1} x2={x2} y2={y2}
              stroke={isActive ? c : 'var(--border-mid)'}
              strokeWidth={isActive ? 2 : 1}
              opacity={isActive ? 1 : 0.5}
            />;
          })}
          {/* Center backing circle */}
          <circle cx={cx} cy={cy} r={r - 18} fill="var(--bg-base)" stroke="var(--border)" />
        </svg>
        {/* Center stack: ALERT / value / LEVEL / level */}
        <div style={{
          position: 'absolute', inset: 0, display: 'flex',
          flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          pointerEvents: 'none', gap: 0,
        }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: c, letterSpacing: '0.12em' }}>EXEC</span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 30, fontWeight: 500, color: 'var(--text-primary)', letterSpacing: '-0.02em', lineHeight: 1.1 }}>
            {value}<span style={{ fontSize: 14, color: 'var(--text-secondary)' }}>%</span>
          </span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-muted)', letterSpacing: '0.12em', marginTop: 2 }}>LEVEL</span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, color: c, letterSpacing: '0.12em' }}>{level}</span>
        </div>
      </div>
    </div>
  );
}

/* ───────────────────────────────────────────────────────────
   LIBRARY PANEL — Mycelium marketplace

function LibraryPanel({ openModal }) {
  const [tab, setTab] = dUseState('operatives');
  const [search, setSearch] = dUseState('');
  const [sortBy, setSortBy] = dUseState('trust'); // trust | downloads | name
  const [freeOnly, setFreeOnly] = dUseState(false);
  const [author, setAuthor] = dUseState('all');

  const items = LIBRARY[tab];

  // Unique authors per tab
  const authors = dUseMemo(() => {
    const set = new Set(items.map(it => it.author));
    return ['all', ...[...set]];
  }, [tab]);

  // Reset author when tab changes if invalid
  dUseEffect(() => { setAuthor('all'); }, [tab]);

  let filtered = items.filter(it => it.name.toLowerCase().includes(search.toLowerCase()));
  if (freeOnly) filtered = filtered.filter(it => (typeof it.pawa === 'string' && it.pawa === 'free') || it.pawa === 0);
  if (author !== 'all') filtered = filtered.filter(it => it.author === author);
  filtered = [...filtered].sort((a, b) => {
    if (sortBy === 'trust') return b.trust - a.trust;
    if (sortBy === 'downloads') return b.downloads - a.downloads;
    return a.name.localeCompare(b.name);
  });

  const TAB_META = {

/* Orchie — shared chat + widget renderer. Used by sidebar (compact) and mobile (full). */



/* ─── Typewriter hook ──────────────────────────────────────
   Progressively reveals text characters at given speed (chars/tick).
*/
function useTypewriter(text, speed = 30, onDone) {
  const [shown, setShown] = oUseState('');
  const doneRef = oUseRef(false);
  oUseEffect(() => {
    setShown('');
    doneRef.current = false;
    if (!text) return;
    let i = 0;
    const interval = setInterval(() => {
      i += Math.max(1, Math.floor(speed / 12));
      if (i >= text.length) {
        setShown(text);
        clearInterval(interval);
        if (!doneRef.current) { doneRef.current = true; onDone?.(); }
      } else {
        setShown(text.slice(0, i));
      }
    }, 16);
    return () => clearInterval(interval);
  }, [text, speed]);
  return shown;
}

function PieWidget({ data, size }) {
  const total = data.slices.reduce((s, x) => s + x.value, 0);
  const dim = size === 'sm' ? 88 : 120;
  const r = dim / 2 - 6;
  const cx = dim / 2, cy = dim / 2;
  const inner = r * 0.55;

  // Compute arcs
  let acc = 0;
  const arcs = data.slices.map(s => {
    const start = (acc / total) * 2 * Math.PI;
    acc += s.value;
    const end = (acc / total) * 2 * Math.PI;
    return { ...s, start, end };
  });

  const pathArc = (a) => {
    const x1 = cx + r * Math.cos(a.start - Math.PI / 2);
    const y1 = cy + r * Math.sin(a.start - Math.PI / 2);
    const x2 = cx + r * Math.cos(a.end - Math.PI / 2);
    const y2 = cy + r * Math.sin(a.end - Math.PI / 2);
    const xi2 = cx + inner * Math.cos(a.end - Math.PI / 2);
    const yi2 = cy + inner * Math.sin(a.end - Math.PI / 2);
    const xi1 = cx + inner * Math.cos(a.start - Math.PI / 2);
    const yi1 = cy + inner * Math.sin(a.start - Math.PI / 2);
    const large = a.end - a.start > Math.PI ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${inner} ${inner} 0 ${large} 0 ${xi1} ${yi1} Z`;
  };

  return (
    <div style={{
      background: 'var(--bg-surface)', border: '1px solid var(--border)',
      borderRadius: 'var(--radius-md)', padding: size === 'sm' ? '10px 12px' : '14px 16px',
      display: 'flex', gap: 14, alignItems: 'center',
    }}>
      <div style={{ position: 'relative', flexShrink: 0 }}>
        <svg width={dim} height={dim}>
          {arcs.map((a, i) => (
            <path
              key={i}
              d={pathArc(a)}
              fill={a.color}
              style={{
                opacity: 0,
                animation: `fadeUp 0.4s ease-out ${0.15 + i * 0.08}s forwards`,
                transformOrigin: `${cx}px ${cy}px`,
              }}
            />
          ))}
        </svg>
        <div style={{
          position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', pointerEvents: 'none',
        }}>
          <span className="label-10" style={{ fontSize: 8 }}>TOTAL</span>
          <span style={{ fontFamily: 'var(--mono)', fontSize: size === 'sm' ? 10 : 12, fontWeight: 500, color: 'var(--text-primary)' }}>{data.total}</span>
        </div>
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 4, minWidth: 0 }}>
        {data.slices.map((s, i) => (
          <div key={i} className="fade-up" style={{
            display: 'grid', gridTemplateColumns: '8px 1fr auto', gap: 8, alignItems: 'center',
            animationDelay: `${0.25 + i * 0.06}s`,
          }}>
            <span style={{ width: 7, height: 7, background: s.color, borderRadius: 1 }} />
            <span style={{ fontFamily: 'var(--ui)', fontSize: 11, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.label}</span>
            <span className="val-12" style={{ fontSize: 10, color: 'var(--text-secondary)' }}>{s.value}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function LineWidget({ data, size }) {
  const W = size === 'sm' ? 280 : 360;
  const H = size === 'sm' ? 80 : 100;
  const series = data.series;
  const min = Math.min(...series, data.threshold || Infinity) * 0.9;
  const max = Math.max(...series, data.threshold || -Infinity) * 1.05;
  const range = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * (W - 24) + 12;
    const y = H - ((v - min) / range) * H + 8;
    return [x, y];
  });
  const linePath = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x} ${y}`).join(' ');
  const lastY = pts[pts.length - 1][1];
  const lastX = pts[pts.length - 1][0];
  const thrY = data.threshold ? (H - ((data.threshold - min) / range) * H + 8) : null;

  return (
    <div style={{
      background: 'var(--bg-surface)', border: '1px solid var(--border)',
      borderRadius: 'var(--radius-md)', padding: size === 'sm' ? '10px 12px' : '14px 16px',
      display: 'flex', flexDirection: 'column', gap: 6,
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
        <span className="label-10">BURN RATE · LAST 12 DAYS</span>
        <span className="val-12" style={{ fontSize: 11, color: 'var(--amber)' }}>{series[series.length - 1].toLocaleString()} {data.unit}</span>
      </div>
      <svg width={W} height={H + 18} style={{ overflow: 'visible' }}>
        {/* Threshold line */}
        {thrY != null && (
          <>
            <line x1="0" y1={thrY} x2={W} y2={thrY} stroke="var(--danger)" strokeDasharray="2 3" strokeWidth="1" opacity="0.6" />
            <text x={W - 4} y={thrY - 4} textAnchor="end" fontFamily="DM Mono" fontSize="9" fill="var(--danger)">CEILING {data.threshold}</text>
          </>
        )}
        {/* Area */}
        <path
          d={`${linePath} L ${lastX} ${H + 8} L 12 ${H + 8} Z`}
          fill="var(--amber-glow)"
          style={{ opacity: 0, animation: 'fadeUp 0.5s ease-out 0.4s forwards' }}
        />
        {/* Line */}
        <path d={linePath} fill="none" stroke="var(--amber)" strokeWidth="1.4"
          className="draw-line"
          style={{ '--dash-len': W * 3, animationDuration: '1s' }}
        />
        {/* End dot */}
        <circle cx={lastX} cy={lastY} r="3" fill="var(--amber)"
          style={{ opacity: 0, animation: 'fadeUp 0.3s ease-out 1.1s forwards' }}
        />
        {/* Labels */}
        {data.labels?.map((l, i) => {
          if (!l) return null;
          const x = (i / (series.length - 1)) * (W - 24) + 12;
          return <text key={i} x={x} y={H + 18} textAnchor="middle" fontFamily="DM Mono" fontSize="9" fill="var(--text-muted)">{l}</text>;
        })}
      </svg>
    </div>
  );
}

/* Streamed conversation hook — plays scripted messages with delays */
function useStreamedConversation(script, autoStart = true, baseDelay = 1200) {
  const [shown, setShown] = oUseState([]);
  const [thinking, setThinking] = oUseState(false);
  const idxRef = oUseRef(0);

  const playNext = () => {
    if (idxRef.current >= script.length) return;
    setThinking(true);
    const msg = script[idxRef.current];
    const thinkTime = 400 + Math.random() * 600;
    setTimeout(() => {
      setThinking(false);
      setShown(s => [...s, msg]);
      idxRef.current += 1;
    }, thinkTime);
  };

  // Auto-start sequence
  oUseEffect(() => {
    if (!autoStart) return;
    if (shown.length === 0 && idxRef.current === 0) {
      const t0 = setTimeout(() => playNext(), 600);
      return () => clearTimeout(t0);
    }
  }, []);

  const onMessageDone = () => {
    setTimeout(() => playNext(), baseDelay);
  };

  const send = (text) => {
    setShown(s => [...s, { role: 'user', text }]);
    setThinking(true);
    setTimeout(() => {
      setThinking(false);
      // Loop back to a relevant assistant reply
      const reply = pickReply(text);
      setShown(s => [...s, reply]);
    }, 900 + Math.random() * 800);
  };

  const restart = () => {
    setShown([]);
    idxRef.current = 0;
    setThinking(false);
    setTimeout(() => playNext(), 400);
  };

  return { messages: shown, thinking, onMessageDone, send, restart };
}

function pickReply(text) {
  const t = text.toLowerCase();
  if (t.includes('budget') || t.includes('pocket')) {
    return {
      role: 'assistant',
      text: "Here's the pocket breakdown again, with overspend flagged in amber:",
      widget: { type: 'pie', data: ORCHIE_DEMO[2].widget.data },
    };
  }
  if (t.includes('burn') || t.includes('rate')) {
    return {
      role: 'assistant',
      text: "Burn rate over the last 12 days — we're 6% under ceiling but trending up:",
      widget: { type: 'line', data: ORCHIE_DEMO[3].widget.data },
    };
  }
  if (t.includes('reall') || t.includes('move') || t.includes('reallocate')) {
    return {
      role: 'assistant',
      text: "Simulated. Moving KSH 400k from Treasury Ops → Carbon-R&D keeps you 6.1% above the council floor and unblocks two grants by 9 days. Draft as SUS-0149?",

/* Mycelium Control Panel — app shell, nav, state, Tweaks integration */



const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "sustain": "homestead.bonnie",
  "panel": "monitor",
  "tickRate": 1000,
  "accent": "amber",
  "density": "regular",
  "showOrchie": true,
  "showGrain": true
}/*EDITMODE-END*/;

const PANELS = [
  { id: 'monitor',    label: 'MONITOR',    icon: 'pulse',    sub: 'live observability' },
  { id: 'simulator',  label: 'SIMULATOR',  icon: 'crosshair', sub: 'forked execution' },
  { id: 'editor',     label: 'EDITOR',     icon: 'agent',    sub: 'spec & graph' },
  { id: 'controller', label: 'CONTROLLER', icon: 'vault',    sub: 'approved execution' },
  { id: 'library',    label: 'LIBRARY',    icon: 'leaf',     sub: 'mycelium network' },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [panel, setPanel] = dUseState(t.panel || 'monitor');
  const [sustainId, setSustainId] = dUseState(t.sustain || 'homestead.bonnie');
  const [tick, setTick] = dUseState(0);
  const [clock, setClock] = dUseState(formatClock(new Date()));
  const [modal, setModal] = dUseState(null);   // {kind:'proposal'|'library'|'confirm'|'pin', data}
  const [toasts, setToasts] = dUseState([]);   // [{id, text, tone}]
  const [orchieOpen, setOrchieOpen] = dUseState(t.showOrchie ?? false);
  const [orchieMode, setOrchieMode] = dUseState(null); // null | 'dialog' | 'desktop' | 'mobile'
  const [navCollapsed, setNavCollapsed] = dUseState(false);
  // Per-panel side-rail visibility (Sim & Editor)
  const [simLeft, setSimLeft] = dUseState(true);
  const [simRight, setSimRight] = dUseState(true);
  const [editLeft, setEditLeft] = dUseState(true);
  const [editRight, setEditRight] = dUseState(true);

  // Wire up globals for any component to flash a toast or confirm an action
  dUseEffect(() => {
    window.flash = (text, tone = 'ok') => {
      const id = Math.random().toString(36).slice(2);
      setToasts(ts => [...ts, { id, text, tone }]);
      setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 3600);
    };
    window.confirmAction = (opts) => setModal({ kind: 'confirm', data: opts });
    window.openPinPad = (opts) => setModal({ kind: 'pin', data: opts });
  }, []);

  dUseEffect(() => setPanel(t.panel), [t.panel]);
  dUseEffect(() => setSustainId(t.sustain), [t.sustain]);

  // Tick loop
  dUseEffect(() => {
    const rate = t.tickRate || 1000;
    const id = setInterval(() => {
      setTick(x => x + 1);
      setClock(formatClock(new Date()));
    }, rate);
    return () => clearInterval(id);
  }, [t.tickRate]);

  const sustain = SUSTAINS.find(s => s.id === sustainId) || SUSTAINS[0];

  const switchPanel = (id) => {
    setPanel(id);
    setTweak('panel', id);
  };

  // Esc closes modal and Orchie overlay
  dUseEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') {
        setModal(null);
        setOrchieMode(null);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const navWidth = navCollapsed ? 56 : 200;

  return (
    <div data-density={t.density} style={{
      display: 'grid',
      gridTemplateAreas: `
        "header header"
        "rail   main"
        "footer footer"
      `,
      gridTemplateRows: '44px 1fr 30px',
      gridTemplateColumns: `${navWidth}px 1fr`,
      height: '100vh', width: '100vw',
      background: 'var(--bg-base)',
    }}>
      <TopBar
        clock={clock} sustain={sustain}
        sustains={SUSTAINS} onSustainChange={(id) => { setSustainId(id); setTweak('sustain', id); }}
      />
      <LeftNav
        panels={PANELS} active={panel} onSelect={switchPanel}
        collapsed={navCollapsed} onToggle={() => setNavCollapsed(c => !c)}
      />

      <main style={{ gridArea: 'main', overflow: 'hidden', minHeight: 0, position: 'relative' }}>
        {panel === 'monitor'    && <MonitorPanel tick={tick} sustain={sustain} />}
        {panel === 'simulator'  && <SimulatorPanel tick={tick} sustain={sustain}
          leftOpen={simLeft} rightOpen={simRight}
          onToggleLeft={() => setSimLeft(v => !v)}
          onToggleRight={() => setSimRight(v => !v)} />}
        {panel === 'editor'     && <EditorPanel sustain={sustain}
          leftOpen={editLeft} rightOpen={editRight}
          onToggleLeft={() => setEditLeft(v => !v)}
          onToggleRight={() => setEditRight(v => !v)} />}
        {panel === 'controller' && <ControllerPanel tick={tick} openModal={(p) => setModal({ kind: 'proposal', data: p })} />}
        {panel === 'library'    && <LibraryPanel openModal={(it, kind) => setModal({ kind: 'library', data: { item: it, kind } })} />}
      </main>

      {/* Floating Orchie button + drawer */}
      <OrchieFAB
        open={orchieOpen}
        onToggle={() => setOrchieOpen(o => !o)}
        onOpenOrchie={() => setOrchieMode('dialog')}
      />

      <Footer tick={tick} />

      {/* Orchie full-panel overlays — mode dialog → desktop or mobile */}
      {orchieMode === 'dialog' && (
        <OrchieModeDialog
          onSelect={(m) => setOrchieMode(m)}
          onClose={() => setOrchieMode(null)}
        />
      )}
      {orchieMode === 'desktop' && (
        <OrchieDesktopPanel
          tick={tick}
          onClose={() => setOrchieMode(null)}
        />
      )}
      {orchieMode === 'mobile' && (
        <OrchieExpansionPanel
          open={true}
          tick={tick}
          onClose={() => setOrchieMode(null)}
        />
      )}

      {modal?.kind === 'proposal' && <ProposalModal p={modal.data} onClose={() => setModal(null)} />}
      {modal?.kind === 'library' && <LibraryModal data={modal.data} onClose={() => setModal(null)} />}
      {modal?.kind === 'confirm' && <ConfirmModal opts={modal.data} onClose={() => setModal(null)} />}
      {modal?.kind === 'pin' && <PinPad opts={modal.data} onClose={() => setModal(null)} />}

      {/* Toast stack */}
      <div className="toast-stack" style={{ bottom: orchieOpen ? 'calc(100vh - 80px)' : 80 }}>
        {toasts.map(t => (
          <div key={t.id} className="toast" style={{
            borderLeft: `2px solid ${t.tone === 'ok' ? 'var(--ok)' : t.tone === 'danger' ? 'var(--danger)' : t.tone === 'amber' ? 'var(--amber)' : 'var(--info)'}`,
            pointerEvents: 'auto',
          }}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%',
              background: t.tone === 'ok' ? 'var(--ok)' : t.tone === 'danger' ? 'var(--danger)' : t.tone === 'amber' ? 'var(--amber)' : 'var(--info)',
              flexShrink: 0,
            }} />
            <span style={{ flex: 1, color: 'var(--text-primary)' }}>{t.text}</span>
          </div>
        ))}
      </div>

      <TweaksPanel>
        <TweakSection label="Workspace" />
        <TweakSelect label="Sustain" value={t.sustain}
          options={SUSTAINS.map(s => ({ value: s.id, label: `${s.label} · ${s.sub}` }))}
          onChange={(v) => setTweak('sustain', v)} />
        <TweakRadio label="Panel" value={t.panel}
          options={['monitor', 'simulator', 'editor', 'controller', 'library']}
          onChange={(v) => setTweak('panel', v)} />
        <TweakRadio label="Density" value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v) => setTweak('density', v)} />
        <TweakSection label="Telemetry" />
        <TweakSlider label="Tick rate" value={t.tickRate} min={250} max={3000} step={250} unit="ms"
          onChange={(v) => setTweak('tickRate', v)} />
        <TweakSection label="Orchie" />
        <TweakButton label="Open Orchie panel" onClick={() => setOrchieMode('dialog')} />
        <TweakSection label="Atmosphere" />
        <TweakToggle label="Background grain" value={t.showGrain}
          onChange={(v) => setTweak('showGrain', v)} />
      </TweaksPanel>
    </div>
  );
}

/* ─── PIN Pad Modal ──────────────────────────────────────── */
function PinPad({ opts, onClose }) {
  const [pin, setPin] = dUseState('');
  const [stage, setStage] = dUseState('enter'); // enter | verifying | success
  dUseEffect(() => {
    if (pin.length === 4 && stage === 'enter') {
      setStage('verifying');
      setTimeout(() => {
        setStage('success');
        setTimeout(() => { opts.onConfirm?.(); onClose(); }, 700);
      }, 900);
    }
  }, [pin, stage]);
  const append = (d) => stage === 'enter' && pin.length < 4 && setPin(p => p + d);
  const back = () => stage === 'enter' && setPin(p => p.slice(0, -1));
  return (
    <div className="modal-scrim" onClick={onClose} style={{ zIndex: 1100 }}>
      <div className="modal-card" onClick={e => e.stopPropagation()} style={{ maxWidth: 380 }}>
        <header style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div className="label-10" style={{ color: 'var(--amber)' }}>BIOMETRIC · PIN REQUIRED</div>
            <h2 style={{ fontFamily: 'var(--ui)', fontSize: 16, fontWeight: 500, marginTop: 4 }}>{opts.title}</h2>
          </div>
          <button onClick={onClose} style={{ color: 'var(--text-muted)', padding: 6 }}><Icon name="x" size={12} /></button>
        </header>
        <div style={{ padding: '18px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 18 }}>
          <p style={{ fontSize: 12, color: 'var(--text-secondary)', textAlign: 'center', lineHeight: 1.5 }}>{opts.body}</p>
          {/* PIN dots */}
          <div style={{ display: 'flex', gap: 16 }}>
            {[0,1,2,3].map(i => (
              <span key={i} style={{
                width: 14, height: 14, borderRadius: '50%',
                background: pin.length > i ? 'var(--amber)' : 'transparent',
                border: `1.5px solid ${stage === 'success' ? 'var(--teal)' : pin.length > i ? 'var(--amber)' : 'var(--border-mid)'}`,
                boxShadow: pin.length > i ? '0 0 6px var(--amber-glow)' : 'none',
                transition: 'all var(--t-fast)',
              }} />
            ))}
          </div>
          {stage === 'verifying' && (
            <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--amber)', letterSpacing: '0.1em' }}>VERIFYING<span className="blink">_</span></span>
          )}
          {stage === 'success' && (
            <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--teal)', letterSpacing: '0.1em' }}>✓ AUTHORIZED</span>
          )}
          {/* Keypad */}
          {stage === 'enter' && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 56px)', gap: 8 }}>
              {[1,2,3,4,5,6,7,8,9].map(n => (
                <button key={n} onClick={() => append(n)} style={pinKeyStyle}>{n}</button>
              ))}
              <span />
              <button onClick={() => append(0)} style={pinKeyStyle}>0</button>
              <button onClick={back} style={{ ...pinKeyStyle, fontSize: 14 }}>⌫</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
const pinKeyStyle = {
  width: 56, height: 48,
  fontFamily: 'var(--mono)', fontSize: 20, color: 'var(--text-primary)',
  background: 'var(--bg-raised)',
  border: '1px solid var(--border-mid)',

              <span className="label-10" style={{ display: 'block', marginBottom: 8 }}>LIVE PREVIEW</span>
              <div style={{
                height: 200, background: 'var(--bg-base)', border: '1px solid var(--border)',
                borderRadius: 'var(--radius-md)', display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <div style={{ transform: 'scale(2.2)' }}>
                  <WidgetPreview name={item.name} />
                </div>
              </div>
            </div>
          )}

          {/* Version history */}
          <div>
            <span className="label-10" style={{ display: 'block', marginBottom: 8 }}>VERSION HISTORY</span>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
              {[
                { v: item.version, when: '14 Feb 2026', notes: 'Performance · 12% latency reduction' },
                { v: bumpVersion(item.version, -1), when: '02 Jan 2026', notes: 'Bug fix · constraint edge-case' },
                { v: bumpVersion(item.version, -2), when: '21 Dec 2025', notes: 'New: ui_schema variant' },
              ].map((h, i) => (
                <div key={i} style={{ display: 'grid', gridTemplateColumns: '90px 110px 1fr', gap: 12, padding: '8px 0', borderBottom: '1px solid var(--border)', alignItems: 'baseline' }}>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: i === 0 ? accent : 'var(--text-primary)' }}>v{h.v}</span>
                  <span className="meta-10" style={{ color: 'var(--text-muted)' }}>{h.when}</span>
                  <span style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-secondary)' }}>{h.notes}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        <footer style={{ padding: '14px 22px', borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
          <span className="meta-10" style={{ color: 'var(--text-muted)' }}>{item.author} · published to Mycelium</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <PBtn variant="ghost" onClick={onClose}>CLOSE</PBtn>
            <PBtn variant="ghost" onClick={() => { window.flash(`${item.name} bookmarked`, 'info'); }}>BOOKMARK</PBtn>
            <PBtn onClick={() => {
              window.confirmAction({
                title: `${installLabel} · ${item.name}?`,
                body: `Pull ${item.name} from the Mycelium and register it in your local sustain. License: ${item.pawa}.`,
                ctaLabel: installLabel,
                tone: 'amber',
                onConfirm: () => { onClose(); window.flash(`${item.name} installed · ${item.downloads + 1} active`, 'ok'); },
              });
            }}>{installLabel}</PBtn>
          </div>
        </footer>
      </div>
    </div>
  );
}

function bumpVersion(v, delta) {
  const [maj, min, pat] = v.split('.').map(n => parseInt(n) || 0);
  if (delta === -1) return `${maj}.${min}.${Math.max(0, pat - 2)}`;
  if (delta === -2) return `${maj}.${Math.max(0, min - 1)}.0`;
  return v;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
