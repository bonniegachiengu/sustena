<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustena · Mycelium Control Panel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap');

:root {
  /* Surfaces */
  --bg-base: #0f0f0f;
  --bg-surface: #181818;
  --bg-raised: #212121;
  --bg-overlay: #2a2a2a;

  /* Borders */
  --border: #2e2e2e;
  --border-mid: #3a3a3a;
  --border-light: #4a4a4a;

  /* Text */
  --text-primary: #e8e4dc;
  --text-secondary: #8a8680;
  --text-muted: #565250;
  --text-dim: #3a3836;

  /* Amber */
  --amber: #E8A020;
  --amber-dim: #c07818;
  --amber-glow: rgba(232, 160, 32, 0.12);
  --amber-border: rgba(232, 160, 32, 0.3);

  /* Teal */
  --teal: #2ab8a0;
  --teal-dim: #1e8c7a;
  --teal-glow: rgba(42, 184, 160, 0.1);
  --teal-border: rgba(42, 184, 160, 0.3);

  /* Status */
  --ok: #4caf80;
  --warn: #e8a020;
  --danger: #e05050;
  --info: #5090e0;

  /* Type */
  --ui: 'Inter Tight', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;

  /* Motion */
  --t-fast: 120ms ease;
  --t-mid: 220ms ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(ellipse 1200px 800px at 12% 0%, rgba(232,160,32,0.02), transparent 55%),
    radial-gradient(ellipse 900px 700px at 100% 100%, rgba(42,184,160,0.018), transparent 55%);
  z-index: 0;
}

#root { position: relative; z-index: 1; height: 100vh; overflow: hidden; }

button, input, textarea { font-family: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ─── Type utilities ─── */
.mono { font-family: var(--mono); }
.label-10 { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.10em; color: var(--text-muted); }
.label-11 { font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
.meta-10 { font-family: var(--mono); font-size: 10px; color: var(--text-secondary); }
.meta-11 { font-family: var(--mono); font-size: 11px; color: var(--text-secondary); }
.val-12  { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-primary); }
.val-22  { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.01em; }
.val-hero { font-family: var(--mono); font-size: 96px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1; }
.ui-13   { font-family: var(--ui); font-size: 13px; font-weight: 400; }
.ui-18   { font-family: var(--ui); font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }

/* ─── Animations ─── */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.pulse { animation: pulse 1.6s ease-in-out infinite; }

@keyframes blink {
  0%, 65% { opacity: 1; }
  70%, 100% { opacity: 0.15; }
}
.blink { animation: blink 1.2s steps(2, end) infinite; }

@keyframes drawLine {
  from { stroke-dashoffset: var(--dash-len, 2000); }
  to { stroke-dashoffset: 0; }
}
.draw-line {
  stroke-dasharray: var(--dash-len, 2000);
  stroke-dashoffset: var(--dash-len, 2000);
  animation: drawLine 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.45s ease-out both; }

@keyframes shimmer {
  from { background-position: -200% 0; }
  to { background-position: 200% 0; }
}
.shimmer {
  background: linear-gradient(90deg, var(--bg-raised) 25%, var(--bg-overlay) 50%, var(--bg-raised) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}

@keyframes flash {
  0% { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }
  100% { color: var(--text-primary); text-shadow: none; }
}
.flash { animation: flash 0.8s ease-out; }

@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ─── Bracket frame (corner crops, Expanse-style) ─── */
.frame {
  position: relative;
  padding: 16px;
}
.frame::before, .frame::after,
.frame > .frame-corner-bl, .frame > .frame-corner-br {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  border-color: var(--border-light);
  border-style: solid;
  border-width: 0;
  pointer-events: none;
}
.frame::before { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
.frame::after  { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
.frame > .frame-corner-bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
.frame > .frame-corner-br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
.frame--amber::before, .frame--amber::after,
.frame--amber > .frame-corner-bl, .frame--amber > .frame-corner-br { border-color: var(--amber-border); }

/* ─── Hover focus ring ─── */
.focus-ring { transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast); }

/* ─── Nav link ─── */
.nav-link {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 9px 14px 9px 16px;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-secondary);
  background: transparent;
  transition: color var(--t-fast), background var(--t-fast);
  text-align: left;
}
.nav-link:hover { color: var(--text-primary); background: var(--bg-raised); }
.nav-link.active {
  color: var(--amber);
  background: var(--amber-glow);
}
.nav-link.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--amber);
}
.nav-link .nav-id { color: var(--text-dim); margin-left: auto; font-size: 9px; }
.nav-link.active .nav-id { color: var(--amber-dim); }

/* ─── Status badge ─── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid var(--border-mid);
  color: var(--text-secondary);
}
.badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-glow); }
.badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-glow); }
.badge-ok     { color: var(--ok);    border-color: rgba(76,175,128,0.3); background: rgba(76,175,128,0.08); }
.badge-danger { color: var(--danger); border-color: rgba(224,80,80,0.3); background: rgba(224,80,80,0.08); }
.badge-muted  { color: var(--text-muted); border-color: var(--border); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ─── Toast ─── */
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast-stack {
  position: fixed; right: 16px; bottom: 16px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 2147483645;
  pointer-events: none;
}
.toast {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  min-width: 260px;
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.2s ease-out;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* ─── Sliding view transition ─── */
@keyframes viewIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.view-root { animation: viewIn 0.32s ease-out both; }

/* ─── Reusable event row ─── */
.event-row {
  display: grid;
  grid-template-columns: 80px 60px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 9px 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  transition: background var(--t-fast);
}
.event-row:hover { background: var(--bg-raised); }
.event-row .e-time { color: var(--text-muted); }
.event-row .e-code { color: var(--amber); letter-spacing: 0.08em; }
.event-row.system .e-code { color: var(--teal); }
.event-row .e-text { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-row .e-meta { color: var(--text-muted); }

/* ─── Hero pulse animation when fresh ─── */
@keyframes heroSettle {
  from { opacity: 0; transform: translateY(8px) scale(0.985); letter-spacing: -0.04em; }
  to { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -0.02em; }
}
.hero-settle { animation: heroSettle 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

/* Number flash on tick */
.tick-num { transition: color 80ms ease; }
.tick-num.tick-pulse { color: var(--amber); }

/* ─── Node type colors for DAG ─── */
:root {
  --node-state: #5090e0;
  --node-operator: #E8A020;
  --node-constraint: #e05050;
  --node-event: #9a7fb8;
  --node-operative: #2ab8a0;
  --node-time: #8a8680;
}

/* ─── DAG node base ─── */
.dag-node {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-primary);
  background: var(--bg-surface);
  border: 1px solid var(--border-mid);
  white-space: nowrap;
  cursor: pointer;
  transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
  user-select: none;
}
.dag-node:hover { transform: translate(-50%, -50%) scale(1.04) !important; z-index: 5; }
.dag-node--active {
  box-shadow: 0 0 0 1px currentColor, 0 0 12px currentColor;
  z-index: 4;
}
.dag-node--pulse::before {
  content: '';
  position: absolute; inset: -3px;
  border: 1px solid currentColor;
  border-radius: inherit;
  opacity: 0.35;
  animation: nodePulse 1.6s ease-out infinite;
}
@keyframes nodePulse {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Travel dot along edge */
@keyframes flowDot {
  from { offset-distance: 0%; }
  to   { offset-distance: 100%; }
}

/* Event log row enters from top */
@keyframes logIn {
  from { opacity: 0; transform: translateY(-6px); background: var(--amber-glow); }
  to   { opacity: 1; transform: translateY(0); background: transparent; }
}
.log-in { animation: logIn 0.6s ease-out both; }

/* ─── Modal ─── */
@keyframes modalFadeIn {
  from { opacity: 0; backdrop-filter: blur(0); }
  to   { opacity: 1; backdrop-filter: blur(6px); }
}
@keyframes modalSlideIn {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-scrim {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  animation: modalFadeIn 0.2s ease-out;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
}
.modal-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  max-width: 720px;
  width: 100%;
  max-height: calc(100vh - 64px);
  display: flex; flex-direction: column;
  animation: modalSlideIn 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
  box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}

/* ─── Panel switch transition ─── */
@keyframes panelEnter {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.panel-enter { animation: panelEnter 0.34s cubic-bezier(0.22, 0.61, 0.36, 1) both; }

/* ─── Highlight pulse ring (for card focus) ─── */
@keyframes highlightRing {
  0%   { box-shadow: 0 0 0 0 var(--amber-border); }
  100% { box-shadow: 0 0 0 8px transparent; }
}
.highlight-ring { animation: highlightRing 0.9s ease-out; }

/* ─── Card hover lift ─── */
.lift {
  transition: transform var(--t-fast), border-color var(--t-fast), background var(--t-fast);
}
.lift:hover {
  border-color: var(--border-light);
  background: var(--bg-raised);
}

/* ─── Terminal ─── */
.terminal {
  font-family: var(--mono);
  font-size: 12px;
  background: #000;
  color: var(--text-primary);
  padding: 14px;
  border-radius: var(--radius-sm);
  overflow-y: auto;
}
.terminal .t-prompt { color: var(--amber); }
.terminal .t-ok { color: var(--ok); }
.terminal .t-err { color: var(--danger); }
.terminal .t-meta { color: var(--text-muted); }
.terminal .t-line { white-space: pre; line-height: 1.55; }

@keyframes cursorBlink { 50% { opacity: 0; } }
.t-cursor {
  display: inline-block;
  width: 7px; height: 13px;
  background: var(--amber);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: cursorBlink 1s steps(2, end) infinite;
}

/* ─── Mobile (Orchie) ─── */
.bubble {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  border-left: 2px solid var(--amber);
}
.bubble-user {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  border-left: none;
  align-self: flex-end;
  max-width: 78%;
}

/* ─── Density tweak hook ─── */
[data-density="compact"] { --pad-y: 8px; --pad-x: 12px; }
[data-density="regular"] { --pad-y: 12px; --pad-x: 16px; }
[data-density="comfy"]   { --pad-y: 16px; --pad-x: 20px; }

/* Hide scrollbar utility (still scrollable) */
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

  </style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ───────────────────────────────────────────────────────────
   LOGO — network node (center disc + 3 branching arcs)
   ─────────────────────────────────────────────────────────── */
function SustenaMark({ size = 18, primary = 'var(--amber)', secondary = 'var(--text-primary)', mono = false }) {
  const a = mono ? secondary : primary;
  const c = secondary;
  const endX = 78 * Math.cos((28 * Math.PI) / 180);
  const endY = 78 * Math.sin((28 * Math.PI) / 180);
  const branchPath = `M 0 0 Q 52 0 ${endX} ${endY}`;
  return (
    <svg width={size} height={size} viewBox="-100 -100 200 200" style={{ display: 'block' }}>
      {[-90, 30, 150].map(r => (
        <g key={r} transform={`rotate(${r})`}>
          <path d={branchPath} stroke={c} strokeWidth="14" fill="none" strokeLinecap="round" />
          <circle cx={endX} cy={endY} r="11" fill={c} />
        </g>
      ))}
      <circle cx="0" cy="0" r="22" fill={a} />
    </svg>
  );
}

function SustenaLogo({ size = 16, gap = 8 }) {
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap }}>
      <SustenaMark size={size} />
      <span style={{
        fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 500,
        letterSpacing: '0.08em', textTransform: 'uppercase',
        color: 'var(--text-primary)', lineHeight: 1,
      }}>
        <span style={{ color: 'var(--amber)' }}>S</span>USTENA
      </span>
    </div>
  );
}

/* ───────────────────────────────────────────────────────────

   ─────────────────────────────────────────────────────────── */
function Icon({ name, size = 14 }) {
  const s = { width: size, height: size, fill: 'none', stroke: 'currentColor', strokeWidth: 1.4, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'pulse':    return <svg {...s} viewBox="0 0 16 16"><path d="M1 8h3l2-5 3 10 2-5h4" /></svg>;
    case 'ledger':   return <svg {...s} viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" /><path d="M5 5h6M5 8h6M5 11h4" /></svg>;
    case 'council':  return <svg {...s} viewBox="0 0 16 16"><circle cx="5" cy="5.5" r="1.6" /><circle cx="11" cy="5.5" r="1.6" /><path d="M2 13c0-2 1.4-3.5 3-3.5s3 1.5 3 3.5" /><path d="M8 13c0-2 1.4-3.5 3-3.5s3 1.5 3 3.5" /></svg>;
    case 'leaf':     return <svg {...s} viewBox="0 0 16 16"><path d="M3 13c0-6 4-10 10-10 0 6-4 10-10 10z" /><path d="M3 13c2-2 4-4 7-6" /></svg>;
    case 'agent':    return <svg {...s} viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="9" rx="1.5" /><circle cx="6.5" cy="8.5" r="0.8" fill="currentColor" stroke="none" /><circle cx="9.5" cy="8.5" r="0.8" fill="currentColor" stroke="none" /><path d="M8 4V2M6 2h4" /></svg>;
    case 'vault':    return <svg {...s} viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" /><circle cx="8" cy="8" r="2.5" /><path d="M8 5.5v0.5M8 10v0.5M5.5 8h0.5M10 8h0.5" /></svg>;
    case 'settings': return <svg {...s} viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3 3l1.5 1.5M11.5 11.5L13 13M3 13l1.5-1.5M11.5 4.5L13 3" /></svg>;
    case 'send':     return <svg {...s} viewBox="0 0 16 16"><path d="M14 2L2 7l5 2 2 5z" /></svg>;
    case 'arrow-up':   return <svg {...s} viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" /></svg>;
    case 'arrow-down': return <svg {...s} viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4" /></svg>;
    case 'chevron':  return <svg {...s} viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" /></svg>;
    case 'check':    return <svg {...s} viewBox="0 0 16 16"><path d="M3 8.5L6.5 12 13 4.5" /></svg>;
    case 'x':        return <svg {...s} viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>;
    case 'plus':     return <svg {...s} viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>;
    case 'expand':   return <svg {...s} viewBox="0 0 16 16"><path d="M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3" /></svg>;
    case 'replay':   return <svg {...s} viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 5-5" /><path d="M3 3v3h3" /></svg>;
    case 'crosshair': return <svg {...s} viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" /><path d="M8 1v3M8 12v3M1 8h3M12 8h3" /></svg>;
    case 'warning':  return <svg {...s} viewBox="0 0 16 16"><path d="M8 2l6.5 11h-13z" /><path d="M8 6v3.5M8 11.5v0.5" /></svg>;
    case 'dot':      return <svg {...s} viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="currentColor" stroke="none" /></svg>;
    default: return null;
  }
}

/* ───────────────────────────────────────────────────────────
   SPARKLINE
   ─────────────────────────────────────────────────────────── */
function Spark({ series, w = 100, h = 28, color = 'var(--text-secondary)', dot = true, animate = true }) {
  const min = Math.min(...series);
  const max = Math.max(...series);
  const range = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x},${y}`;
  }).join(' ');
  const last = series[series.length - 1];
  const lastY = h - ((last - min) / range) * h;
  return (
    <svg width={w} height={h} style={{ overflow: 'visible' }}>
      <polyline
        points={pts} fill="none" stroke={color} strokeWidth="1.2"
        className={animate ? 'draw-line' : undefined}
        style={{ '--dash-len': w * 3 }}
      />
      {dot && <circle cx={w} cy={lastY} r="2" fill={color} />}
    </svg>
  );
}

/* ───────────────────────────────────────────────────────────
   AREA CHART
   ─────────────────────────────────────────────────────────── */
function AreaChart({ series, w = 600, h = 160, color = 'var(--amber)', fill = 'var(--amber-glow)', animate = true, axis = true }) {
  if (!series || series.length < 2) return null;
  const min = 0;
  const max = Math.max(...series) * 1.1;
  const range = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return [x, y];
  });
  const linePath = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'} ${x} ${y}`).join(' ');
  const areaPath = `M 0 ${h} ` + pts.map(([x, y]) => `L ${x} ${y}`).join(' ') + ` L ${w} ${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" width="100%" height="100%" style={{ display: 'block', overflow: 'visible' }}>
      {axis && [0.25, 0.5, 0.75].map(p => (
        <line key={p} x1="0" y1={h * p} x2={w} y2={h * p} stroke="var(--border)" strokeDasharray="2 4" strokeWidth="0.5" />
      ))}
      <path d={areaPath} fill={fill} className={animate ? 'fade-up' : undefined} style={{ animationDelay: '0.6s', animationFillMode: 'both', opacity: animate ? 0 : 1, ...(animate ? { animation: 'fadeUp 0.6s ease-out 0.6s forwards' } : {}) }} />
      <path d={linePath} fill="none" stroke={color} strokeWidth="1.4"
        className={animate ? 'draw-line' : undefined}
        style={{ '--dash-len': w * 3 }}
      />
      {/* End marker */}
      <circle
        cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="3"
        fill={color}
        style={{ opacity: animate ? 0 : 1, animation: animate ? 'fadeUp 0.3s ease-out 1.4s forwards' : undefined }}
      />
    </svg>
  );
}

/* Sustena — Shared data models + DAG rendering components
   DagNode (Step 6: text-first, icon secondary, min 13px labels)
   DagEdges (Step 6: reduced opacity, selected highlight)
   CodeEditor (Step 6: Python syntax highlighting, line numbers)
   OrchieExpansionPanel (Step 4: intent cards + ambient activity)
   All data: SUSTAINS, STATE_TREE, OPERATIVES, SIM_NODES/EDGES, etc.
*/



/* ═══════════════════════════════════════════════════════════
   NODE COLOUR + ICON CONFIG
   ═══════════════════════════════════════════════════════════ */
const NODE_STYLES = {
  state:      { bg: 'var(--node-state)',      border: 'var(--node-state)',      icon: '▭', label: 'STATE' },
  operator:   { bg: 'var(--node-operator)',   border: 'var(--node-operator)',   icon: '◖◗', label: 'OP'   },
  constraint: { bg: 'var(--node-constraint)', border: 'var(--node-constraint)', icon: '◆',  label: 'CSTR' },
  event:      { bg: 'var(--node-event)',      border: 'var(--node-event)',      icon: '⬡',  label: 'EVT'  },
  operative:  { bg: 'var(--node-operative)',  border: 'var(--node-operative)',  icon: '⬢',  label: 'AGT'  },
  gate:       { bg: 'var(--text-muted)',      border: 'var(--text-muted)',      icon: '⊕',  label: 'GATE' },
};

/* ═══════════════════════════════════════════════════════════
   DAG EDGES — reduced opacity (0.4), selected = 1.0 + amber
   ═══════════════════════════════════════════════════════════ */
function DagEdges({ nodes, edges, activePath, width, height }) {
  const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
  const NODE_W = 130, NODE_H = 46;

  return (
    <svg
      width={width} height={height}
      style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible' }}
    >
      <defs>
        <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="var(--text-dim)" />
        </marker>
        <marker id="arrowhead-active" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="var(--amber)" />
        </marker>
      </defs>
      {edges.map(([fromId, toId], i) => {
        const from = nodeMap[fromId];
        const to   = nodeMap[toId];
        if (!from || !to) return null;
        const x1 = from.x + NODE_W;
        const y1 = from.y + NODE_H / 2;
        const x2 = to.x;
        const y2 = to.y + NODE_H / 2;
        const dx = (x2 - x1) * 0.45;
        const path = `M ${x1} ${y1} C ${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`;
        const isActive = activePath.includes(fromId) && activePath.includes(toId);
        return (
          <path
            key={i}
            d={path}
            fill="none"
            stroke={isActive ? 'var(--amber)' : 'var(--text-dim)'}
            strokeWidth={isActive ? 1.4 : 0.9}
            opacity={isActive ? 1.0 : 0.4}
            markerEnd={isActive ? 'url(#arrowhead-active)' : 'url(#arrowhead)'}
            strokeDasharray={isActive ? 'none' : 'none'}
          />
        );
      })}
    </svg>
  );
}

/* ═══════════════════════════════════════════════════════════
   DAG NODE — text label prominent, icon top-right corner
   Step 6: min 13px label, label-first, icon is secondary
   ═══════════════════════════════════════════════════════════ */
function DagNode({ node, active, pulse, onClick, onOrchieExpand }) {
  const [hovered, setHovered] = dUseState(false);
  const style = NODE_STYLES[node.type] || NODE_STYLES.state;
  const isActive = active || hovered;
  const isOrchie = node.type === 'operative' && node.label.toLowerCase().includes('orchie');
  const isOperator = node.type === 'operator';
  const W = 130, H = 46;

  const handleClick = () => {
    if (isOrchie && onOrchieExpand) {
      onOrchieExpand(node);
    } else if (isOperator && onClick) {
      onClick(node);
    } else if (onClick) {
      onClick(node);
    }
  };

  return (
    <div
      onClick={handleClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        position: 'absolute',
        left: node.x, top: node.y,
        width: W, height: H,
        background: isActive ? `${style.bg}22` : 'var(--bg-surface)',
        border: `1.5px solid ${isActive ? style.bg : 'var(--border-mid)'}`,
        borderRadius: 'var(--radius-md)',
        boxShadow: pulse
          ? `0 0 12px ${style.bg}60, 0 0 24px ${style.bg}25`
          : (isActive ? `0 4px 14px rgba(0,0,0,0.4)` : `0 2px 6px rgba(0,0,0,0.25)`),
        cursor: (isOrchie || isOperator) ? 'pointer' : 'default',
        transition: 'all var(--t-mid)',
        display: 'flex', alignItems: 'center',
        padding: '0 10px 0 10px',
        gap: 8,
        animation: pulse ? 'dagPulse 1.8s ease-in-out infinite' : 'none',
        userSelect: 'none',
        overflow: 'hidden',
      }}
    >
      <style>{`
        @keyframes dagPulse {
          0%, 100% { box-shadow: 0 0 8px ${style.bg}50; }
          50%       { box-shadow: 0 0 18px ${style.bg}80, 0 0 32px ${style.bg}30; }
        }
      `}</style>

      {/* Label — PROMINENT, min 13px */}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 1 }}>
        {/* Node type tag (tiny, above label) */}
        <span style={{
          fontFamily: 'var(--mono)', fontSize: 8, fontWeight: 500,
          letterSpacing: '0.08em', textTransform: 'uppercase',
          color: isActive ? style.bg : 'var(--text-dim)',
          lineHeight: 1,
        }}>
          {style.label}
        </span>
        {/* Main label — min 13px, text with background if on dark canvas */}
        <span style={{
          fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 500,
          color: isActive ? 'var(--text-primary)' : 'var(--text-secondary)',
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          lineHeight: 1.2,
          /* Subtle label backing for legibility */
          textShadow: '0 1px 3px rgba(0,0,0,0.5)',
        }}>
          {node.label}
        </span>
      </div>

      {/* Icon — secondary, top-right corner */}
      <span style={{
        fontFamily: 'var(--mono)', fontSize: 13,
        color: isActive ? style.bg : 'var(--text-dim)',
        flexShrink: 0,
        opacity: isActive ? 1 : 0.55,
        transition: 'opacity var(--t-fast)',
      }}>
        {style.icon}
      </span>

      {/* Active/pulse glow bar at bottom */}
      {isActive && (
        <span style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, height: 2,
          background: style.bg, opacity: pulse ? 1 : 0.6,
          animation: pulse ? 'pulse 1.6s ease-in-out infinite' : 'none',
        }} />
      )}

      {/* Orchie expand hint */}
      {isOrchie && hovered && (
        <span style={{
          position: 'absolute', top: -18, left: '50%', transform: 'translateX(-50%)',
          fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--amber)',
          background: 'var(--bg-raised)', padding: '2px 6px', borderRadius: 4,
          border: '1px solid var(--amber-border)', whiteSpace: 'nowrap',
          pointerEvents: 'none',
        }}>
          EXPAND ↗
        </span>
      )}

      {/* Operator code hint */}
      {isOperator && hovered && (
        <span style={{
          position: 'absolute', top: -18, left: '50%', transform: 'translateX(-50%)',
          fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--node-operator)',
          background: 'var(--bg-raised)', padding: '2px 6px', borderRadius: 4,
          border: `1px solid var(--node-operator)50`, whiteSpace: 'nowrap',
          pointerEvents: 'none',
        }}>
          EDIT CODE ↑
        </span>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   CODE EDITOR — Python syntax highlight, no external lib

const PY_KEYWORDS = /\b(def|return|if|elif|else|for|while|in|not|and|or|True|False|None|import|from|as|class|pass|break|continue|try|except|finally|with|yield|lambda|del|global|nonlocal|raise|assert)\b/g;
const PY_STRINGS  = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|"""[\s\S]*?"""|'''[\s\S]*?''')/g;
const PY_COMMENTS = /(#[^\n]*)/g;
const PY_NUMBERS  = /\b(\d+\.?\d*)\b/g;
const PY_FUNCS    = /\b([a-zA-Z_]\w*)\s*(?=\()/g;
const PY_DECORATORS = /(@[a-zA-Z_]\w*)/g;

function highlightPython(code) {
  // Build HTML string — escape first, then inject spans
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let result = '';
  let i = 0;

  // Tokenise line by line to handle comments correctly
  const lines = code.split('\n');
  return lines.map(line => {
    // Tokenise: strings > comments > keywords > numbers > funcs > decorators > plain
    let out = '';
    let rest = line;
    let col = 0;

    // Collect tokens with position
    const tokens = [];

    // Strings (including triple-quoted, handled per line for simplicity)
    let m;
    const str_re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g;
    str_re.lastIndex = 0;
    while ((m = str_re.exec(rest)) !== null) {
      tokens.push({ start: m.index, end: m.index + m[0].length, type: 'string', val: m[0] });
    }

    // Comments
    const com_re = /(#[^\n]*)/g;
    com_re.lastIndex = 0;
    while ((m = com_re.exec(rest)) !== null) {
      if (!tokens.some(t => m.index >= t.start && m.index < t.end)) {
        tokens.push({ start: m.index, end: m.index + m[0].length, type: 'comment', val: m[0] });
      }
    }

    // Keywords
    const kw_re = /\b(def|return|if|elif|else|for|while|in|not|and|or|True|False|None|import|from|as|class|pass|break|continue|try|except|finally|with|yield|lambda|del|global|nonlocal|raise|assert)\b/g;
    kw_re.lastIndex = 0;
    while ((m = kw_re.exec(rest)) !== null) {
      if (!tokens.some(t => m.index >= t.start && m.index < t.end)) {
        tokens.push({ start: m.index, end: m.index + m[0].length, type: 'keyword', val: m[0] });
      }
    }

    // Numbers
    const num_re = /\b(\d+\.?\d*)\b/g;
    num_re.lastIndex = 0;
    while ((m = num_re.exec(rest)) !== null) {
      if (!tokens.some(t => m.index >= t.start && m.index < t.end)) {
        tokens.push({ start: m.index, end: m.index + m[0].length, type: 'number', val: m[0] });
      }
    }

    // Functions (word before open paren)
    const fn_re = /\b([a-zA-Z_]\w*)\s*(?=\()/g;
    fn_re.lastIndex = 0;
    while ((m = fn_re.exec(rest)) !== null) {
      if (!tokens.some(t => m.index >= t.start && m.index < t.end)) {
        tokens.push({ start: m.index, end: m.index + m[1].length, type: 'func', val: m[1] });
      }
    }

    // Sort by start pos
    tokens.sort((a, b) => a.start - b.start);

    let pos = 0;
    const COLOR = {
      keyword: '#e8a020',
      string:  '#2ab8a0',
      comment: '#565250',
      number:  '#9a7fb8',
      func:    '#5090e0',
    };
    for (const t of tokens) {
      if (t.start < pos) continue;
      out += esc(rest.slice(pos, t.start));
      out += `<span style="color:${COLOR[t.type]}">${esc(t.val)}</span>`;
      pos = t.end;
    }
    out += esc(rest.slice(pos));
    return out;
  }).join('\n');
}

const DEFAULT_OPERATOR_CODE = `# Operator: budget.allocate
# Sustena · homestead.bonnie
# Version: 2.1.0

def execute(state, inputs):
    """Allocate funds to a pocket."""
    pocket_name = inputs["pocket_name"]
    amount = inputs["amount"]
    period = inputs.get("period", "monthly")

    # Constraint checks (pre-execution)
    cash = state.finances.cash_position
    if cash < amount:
        raise ConstraintError("balance_constraint", cash, amount)

    allocated = state.finances.pockets.get(pocket_name, 0)
    total = sum(state.finances.pockets.values())

    if total + amount > state.income.monthly:
        raise ConstraintError("sum_constraint", total, amount)

    # Apply delta
    delta = {
        f"finances.pockets.{pocket_name}": allocated + amount,
        "finances.cash_position": cash - amount,
    }

    # Emit event
    events = [
        Event("BUDGET_ALLOCATED", {
            "pocket": pocket_name,
            "amount": amount,
            "period": period,
        })
    ]

    return delta, events
`;

}

                position: 'relative',
              }}>
                {/* Dismiss */}
                <button onClick={() => dismissIntent(intent.id)} style={{
                  position: 'absolute', top: 8, right: 8,
                  color: 'var(--text-dim)', padding: 2,
                  transition: 'color var(--t-fast)',
                }}
                onMouseEnter={e => e.currentTarget.style.color = 'var(--text-primary)'}
                onMouseLeave={e => e.currentTarget.style.color = 'var(--text-dim)'}
                >
                  <Icon name="x" size={10} />
                </button>
                <p style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-primary)', lineHeight: 1.4, marginBottom: 8, paddingRight: 16 }}>
                  {intent.text}
                </p>
                {/* Confidence bar */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ flex: 1, height: 3, background: 'var(--bg-raised)', borderRadius: 2, overflow: 'hidden' }}>
                    <div style={{
                      width: `${intent.confidence}%`, height: '100%',
                      background: intent.confidence > 80 ? 'var(--teal)' : intent.confidence > 60 ? 'var(--amber)' : 'var(--text-muted)',
                      borderRadius: 2, transition: 'width 0.6s ease',
                    }} />
                  </div>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-secondary)', minWidth: 30 }}>{intent.confidence}%</span>
                </div>
                <span className="meta-10" style={{ fontSize: 9, color: 'var(--text-dim)', marginTop: 4, display: 'block' }}>{intent.source}</span>
              </div>
            ))}
            {intents.length === 0 && (
              <div style={{ textAlign: 'center', padding: '16px 0' }}>
                <span className="meta-11" style={{ color: 'var(--text-dim)' }}>All intents reviewed</span>
              </div>
            )}
          </div>
        </div>

        {/* ── Customisations ── */}
        <div style={{ padding: '12px 14px', borderBottom: '1px solid var(--border)' }}>
          <span className="label-10" style={{ display: 'block', marginBottom: 10 }}>CUSTOMISATIONS</span>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {/* Response length */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              <span className="meta-10" style={{ color: 'var(--text-muted)' }}>Response length</span>
              <div style={{ display: 'flex', gap: 3 }}>
                {['brief', 'balanced', 'detailed'].map(v => (
                  <button key={v} onClick={() => setPrefResponseLen(v)} style={{
                    flex: 1, padding: '4px 0',
                    fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '0.06em', textTransform: 'uppercase',
                    color: prefResponseLen === v ? 'var(--amber)' : 'var(--text-muted)',
                    background: prefResponseLen === v ? 'var(--amber-glow)' : 'transparent',
                    border: `1px solid ${prefResponseLen === v ? 'var(--amber-border)' : 'var(--border)'}`,
                    borderRadius: 'var(--radius-sm)', transition: 'all var(--t-fast)',
                  }}>{v}</button>
                ))}
              </div>
            </div>
            {/* Proactive suggestions */}
            <OrchieToggle label="Proactive suggestions" value={prefProactive} onChange={setPrefProactive} />
            {/* Notification level */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              <span className="meta-10" style={{ color: 'var(--text-muted)' }}>Notification level</span>
              <div style={{ display: 'flex', gap: 3 }}>
                {['all', 'important', 'silent'].map(v => (
                  <button key={v} onClick={() => setPrefNotifs(v)} style={{
                    flex: 1, padding: '4px 0',
                    fontFamily: 'var(--mono)', fontSize: 9, letterSpacing: '0.06em', textTransform: 'uppercase',
                    color: prefNotifs === v ? 'var(--amber)' : 'var(--text-muted)',
                    background: prefNotifs === v ? 'var(--amber-glow)' : 'transparent',
                    border: `1px solid ${prefNotifs === v ? 'var(--amber-border)' : 'var(--border)'}`,
                    borderRadius: 'var(--radius-sm)', transition: 'all var(--t-fast)',
                  }}>{v}</button>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* ── BOTTOM HALF: Activity visualisation ── */}
        <div style={{ padding: '12px 14px', flex: 1 }}>
          <span className="label-10" style={{ display: 'block', marginBottom: 10 }}>ACTIVITY · AMBIENT</span>
          <OrchieActivityViz tick={tick} />
        </div>
      </div>
    </div>
  );
}

function OrchieToggle({ label, value, onChange }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
      <span style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-secondary)' }}>{label}</span>
      <button onClick={() => onChange(!value)} style={{
        width: 32, height: 18, borderRadius: 9, flexShrink: 0,
        background: value ? 'var(--amber)' : 'var(--bg-overlay)',
        border: `1px solid ${value ? 'var(--amber)' : 'var(--border-mid)'}`,
        position: 'relative', transition: 'all var(--t-mid)', cursor: 'pointer',
      }}>
        <span style={{
          position: 'absolute', top: 2,
          left: value ? 'calc(100% - 16px)' : 2,
          width: 12, height: 12, borderRadius: 6,
          background: value ? 'var(--bg-base)' : 'var(--text-dim)',
          transition: 'left var(--t-mid)',
        }} />
      </button>
    </div>
  );
}

/* Ambient activity SVG animation — 4 states cycling via CSS */
function OrchieActivityViz({ tick }) {
  // States: delegating, receiving, querying, voting
  const state = tick % 4;
  const nodes = [
    { label: 'ORCHIE',   x: 90, y: 80, isCenter: true },
    { label: 'budget.op', x: 30, y: 40  },
    { label: 'pantry.op', x: 155, y: 40 },
    { label: 'COUNCIL',   x: 90, y: 140 },
    { label: 'INBOX',     x: 30, y: 130 },
  ];

  // Animated dot positions — different per state
  const dotPath = {
    0: [{ from: 0, to: 1 }, { from: 0, to: 2 }], // delegating
    1: [{ from: 1, to: 0 }, { from: 2, to: 0 }], // receiving feedback
    2: [{ from: 4, to: 0 }],                       // answering query
    3: [{ from: 0, to: 3 }, { from: 3, to: 0 }],  // council voting
  }[state] || [];

  const stateLabels = ['DELEGATING', 'RECEIVING', 'ANSWERING', 'VOTING'];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {/* State label */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span className="pulse" style={{ width: 5, height: 5, borderRadius: '50%', background: 'var(--amber)', flexShrink: 0 }} />
        <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--amber)', letterSpacing: '0.08em' }}>{stateLabels[state]}</span>
      </div>

      {/* SVG ambient graph */}
      <svg width="100%" height="180" viewBox="0 0 190 180" style={{ overflow: 'visible' }}>
        <style>{`
          @keyframes orchDot {
            0%   { transform: translate(0px, 0px); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
          }
          @keyframes orchPulse {
            0%, 100% { r: 9; opacity: 0.7; }
            50%       { r: 13; opacity: 1; }
          }
        `}</style>

        {/* Edges */}
        {[
          [0,1],[0,2],[0,3],[0,4]
        ].map(([a,b], i) => (
          <line key={i}
            x1={nodes[a].x} y1={nodes[a].y}
            x2={nodes[b].x} y2={nodes[b].y}
            stroke="var(--border-mid)" strokeWidth="0.8" opacity="0.4"
          />
        ))}

        {/* Nodes */}
        {nodes.map((n, i) => (
          <g key={i}>
            {n.isCenter ? (
              <>
                <circle cx={n.x} cy={n.y} r="14"
                  fill="var(--amber-glow)" stroke="var(--amber-border)" strokeWidth="1"
                  style={{ animation: 'orchPulse 2s ease-in-out infinite' }}
                />
                <g transform={`translate(${n.x-7}, ${n.y-7})`}>
                  <SustenaMark size={14} primary="var(--amber)" secondary="var(--text-dim)" />
                </g>
              </>
            ) : (
              <>
                <circle cx={n.x} cy={n.y} r="7"
                  fill="var(--bg-raised)" stroke="var(--border-mid)" strokeWidth="1"
                />
                <circle cx={n.x} cy={n.y} r="3"
                  fill="var(--text-dim)"
                />
              </>
            )}
            <text x={n.x} y={n.y + (n.isCenter ? 24 : 18)}
              textAnchor="middle"
              fontFamily="DM Mono" fontSize="8"
              fill="var(--text-muted)"
            >{n.label}</text>
          </g>
        ))}

        {/* Animated flow dots */}
        {dotPath.map((dp, i) => {
          const from = nodes[dp.from];
          const to = nodes[dp.to];
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          return (
            <circle key={`dot-${i}`}
              cx={from.x} cy={from.y} r="3"
              fill="var(--amber)"
              style={{
                '--dx': `${dx}px`, '--dy': `${dy}px`,
                animation: `orchDot 1.8s ease-in-out ${i * 0.4}s infinite`,
                transformOrigin: `${from.x}px ${from.y}px`,
              }}
            />
          );
        })}

        {/* Center pulse ring on query/vote */}
        {(state === 2 || state === 3) && (
          <circle cx={nodes[0].x} cy={nodes[0].y} r="20"
            fill="none" stroke="var(--amber)" strokeWidth="0.8" opacity="0.4"
            style={{ animation: 'orchPulse 1.4s ease-in-out infinite' }}
          />
        )}
      </svg>

      {/* Mini to-do checklist (ambient) */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        <span className="label-10" style={{ fontSize: 9 }}>CURRENT TASKS</span>
        {[
          { done: true,              label: 'Morning briefing compiled' },
          { done: true,              label: 'Council vote SUS-0148 tracked' },
          { done: false, active: true, label: 'Fetching pantry state' },
          { done: false, active: false, label: 'Awaiting M-Pesa confirm' },
        ].map((t, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            <span style={{
              fontFamily: 'var(--mono)', fontSize: 10,
              color: t.done ? 'var(--ok)' : t.active ? 'var(--amber)' : 'var(--text-dim)',
            }}>
              {t.done ? '✓' : t.active ? '⟳' : '○'}
            </span>
            <span style={{
              fontFamily: 'var(--ui)', fontSize: 11,
              color: t.done ? 'var(--text-muted)' : t.active ? 'var(--text-primary)' : 'var(--text-dim)',
              textDecoration: t.done ? 'line-through' : 'none',
            }}>
              {t.label}
            </span>
            {t.active && (
              <span className="pulse" style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--amber)', marginLeft: 2 }} />
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* Monitor panel — live observability. Two columns: live state stream + event log. Operative cards below. */



function MonitorPanel({ tick, sustain }) {
  // Animated state values that occasionally tick
  const stateVals = dUseMemo(() => STATE_TREE.map((s, i) => ({
    ...s,
    live: s.value + (s.fmt === 'ksh' ? Math.sin(tick * 0.1 + i) * (s.value * 0.001) : 0),
  })), [tick]);

  // Synthetic event stream — accumulate
  const [logEntries, setLogEntries] = dUseState(() =>
    Array.from({ length: 8 }).map((_, i) => pickEvent(i + 1000))
  );
  dUseEffect(() => {
    if (tick === 0) return;
    if (tick % 3 === 0) {
      const next = pickEvent(tick + 4321);
      setLogEntries(prev => [next, ...prev].slice(0, 24));
    }
  }, [tick]);

  return (
    <div className="panel-enter" style={{ display: 'flex', flexDirection: 'column', height: '100%', gap: 18, padding: '24px 28px' }}>
      {/* Hero strip: 4 sparse live metrics */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14 }}>
        <HeroTile label="ACTIVE SUSTAINS" value={SUSTAINS.filter(s => s.status === 'live').length} sub="of 5 in scope" tone="ok" />
        <HeroTile label="OPERATORS / MIN" value={Math.round(218 + Math.sin(tick * 0.2) * 14)} live sub="rolling 60s" />
        <HeroTile label="API P95" value={`${Math.round(412 + Math.sin(tick * 0.15) * 18)}`} unit="ms" live sub="haiku · inference" tone={tick % 17 < 3 ? 'amber' : 'default'} />
        <HeroTile label="PAWA BURN" value={Math.round(28 + Math.sin(tick * 0.18) * 4)} unit="/hr" sub={`bal ${8420 - tick % 60}`} tone="default" />
      </div>

      {/* 2-col main: state stream + event log */}
      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 1.3fr)', gap: 14, flex: 1, minHeight: 0 }}>
        {/* Live State Stream */}
        <Card title="LIVE STATE STREAM" sub={`${sustain.label}`} padded={false} scroll
          actions={
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span className="pulse" style={{ width: 5, height: 5, borderRadius: '50%', background: 'var(--teal)' }} />
              <span className="meta-10" style={{ color: 'var(--teal)' }}>SYNC · 28ms</span>
            </div>
          }
        >
          {stateVals.map((s, i) => <StateRow key={s.path} s={s} delay={i * 30} />)}

          actions={
            <div style={{ display: 'flex', gap: 6 }}>

function HeroTile({ label, value, unit, sub, tone, live }) {
  const c = tone === 'ok' ? 'var(--teal)' : tone === 'amber' ? 'var(--amber)' : 'var(--text-primary)';
  return (
    <div className="fade-up" style={{
      background: 'var(--bg-surface)',
      border: '1px solid var(--border)',
      borderRadius: 'var(--radius-md)',
      padding: '14px 16px',
      display: 'flex', flexDirection: 'column', gap: 6,
      position: 'relative', overflow: 'hidden',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span className="label-10">{label}</span>
        {live && <span className="pulse" style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--teal)' }} />}
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
        <span style={{ fontFamily: 'var(--mono)', fontSize: 28, fontWeight: 500, color: c, letterSpacing: '-0.01em' }}>{value}</span>
        {unit && <span className="meta-10">{unit}</span>}
      </div>
      <span className="meta-10" style={{ color: 'var(--text-muted)' }}>{sub}</span>
    </div>
  );
}

function StateRow({ s, delay }) {
  const c = s.cstr === 'ok' ? 'var(--ok)' : s.cstr === 'amber' ? 'var(--amber)' : 'var(--danger)';
  const fmtVal = (v) => {
    if (s.fmt === 'ksh') return Math.round(v).toLocaleString();
    if (s.fmt === '%') return v.toFixed(0);
    if (s.fmt === 'L' || s.fmt === 'kg') return v.toFixed(1);
    return Math.round(v).toLocaleString();
  };
  return (
    <div className="fade-up" style={{
      display: 'grid', gridTemplateColumns: '8px 1fr auto',
      gap: 12, padding: '10px 16px',
      borderBottom: '1px solid var(--border)',
      animationDelay: `${delay}ms`,
      alignItems: 'center',
    }}>
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: c, boxShadow: s.cstr === 'red' ? '0 0 6px var(--danger)' : 'none' }} />
      <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.path}</span>
        {s.desc && <span className="meta-10" style={{ color: 'var(--text-muted)', fontSize: 9 }}>{s.desc}</span>}
      </div>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 500, color: 'var(--text-primary)' }}>
        {fmtVal(s.live)} <span style={{ color: 'var(--text-muted)', fontWeight: 400, fontSize: 11 }}>{s.fmt}</span>
      </span>
    </div>
  );
}

function LogRow({ e, first }) {
  const c = e.tone === 'ok' ? 'var(--ok)' : e.tone === 'amber' ? 'var(--amber)' : e.tone === 'danger' ? 'var(--danger)' : 'var(--teal)';
  return (
    <div className={first ? 'log-in' : ''} style={{
      display: 'grid', gridTemplateColumns: '70px 6px 1.2fr 1.6fr 90px',

      alignItems: 'center',

      <span style={{ color: 'var(--text-muted)' }}>{e.time}</span>
      <span style={{ width: 4, height: 4, borderRadius: '50%', background: c }} />
      <span style={{ color: 'var(--text-secondary)' }}>{e.sustain}</span>
      <span style={{ color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
        <span style={{ color: 'var(--amber)' }}>{e.operator}</span> <span style={{ color: 'var(--text-muted)' }}>→</span> {e.delta}
      </span>
      <span style={{ color: c, textAlign: 'right' }}>{e.op}</span>
    </div>
  );
}

function OperativeCard({ o, delay, tick }) {
  const statusColor = o.status === 'active' ? 'var(--teal)' : o.status === 'alert' ? 'var(--amber)' : 'var(--text-muted)';
  // Animate the "in progress" subtask
  const inProg = o.subtasks.find(t => t.progress > 0 && t.progress < 100);
  const animatedProgress = inProg ? Math.min(100, inProg.progress + ((tick % 20) * 0.5)) : null;
  // Live confidence drift
  const liveConfidence = Math.max(0, Math.min(100, o.confidence + Math.sin(tick * 0.18 + o.id.charCodeAt(0)) * 3));
  // Activity sparkline — synthesize from tick
  const series = dUseMemo(() => {
    const N = 16;
    return Array.from({ length: N }).map((_, i) => {
      const base = o.status === 'idle' ? 8 : o.status === 'alert' ? 70 : 45;
      return base + Math.sin((tick + i * 7) * 0.3 + o.id.charCodeAt(0)) * 18 + (Math.sin(i * 11.3) * 0.5 + 0.5) * 8;
    });
  }, [tick]);

  return (
    <button onClick={() => window.confirmAction?.({
      title: `${o.name} · ${o.role}`,
      body: `${o.task}. Confidence ${o.confidence}%. Pawa burn ${o.pawa} / session. ${o.subtasks.length} subtasks tracked.`,
      detail: o.subtasks.map(s => `${s.done ? '✓' : s.progress > 0 ? '⟳' : '○'} ${s.name}${s.progress > 0 && s.progress < 100 ? ` · ${s.progress}%` : ''}`).join('\n'),
      ctaLabel: o.status === 'idle' ? 'WAKE' : 'PAUSE',
      tone: 'amber',
      onConfirm: () => window.flash?.(`${o.name} ${o.status === 'idle' ? 'woken' : 'paused'}`, 'info'),
    })} className="fade-up lift" style={{
      textAlign: 'left',
      background: 'var(--bg-surface)',
      border: '1px solid var(--border)',
      borderRadius: 'var(--radius-md)',
      padding: '12px 14px',
      display: 'flex', flexDirection: 'column', gap: 10,
      animationDelay: `${delay}ms`,
      position: 'relative',
      overflow: 'hidden',
    }}>
      {/* Status accent bar */}
      <span style={{
        position: 'absolute', top: 0, left: 0, right: 0, height: 2,
        background: statusColor,
        opacity: o.status === 'idle' ? 0.4 : 1,
      }} />
      {/* Live pulse for alert state */}
      {o.status === 'alert' && (
        <span style={{
          position: 'absolute', top: 0, left: 0, right: 0, height: 2,
          background: statusColor,
          animation: 'pulse 1.4s ease-in-out infinite',
          filter: 'blur(2px)',
        }} />
      )}

      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span className="pulse" style={{
            width: 6, height: 6, borderRadius: '50%', background: statusColor,
            boxShadow: o.status !== 'idle' ? `0 0 6px ${statusColor}` : 'none',
          }} />
          <span style={{ fontFamily: 'var(--ui)', fontSize: 13, fontWeight: 500 }}>{o.name}</span>
          <Badge tone={o.status === 'active' ? 'teal' : o.status === 'alert' ? 'amber' : 'muted'}>{o.status}</Badge>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, color: 'var(--text-primary)' }}>
            {Math.round(liveConfidence)}
          </span>
          <span className="meta-10">%</span>
        </div>
      </div>
      <span className="meta-10" style={{ color: 'var(--text-muted)' }}>{o.role}</span>

      {/* Activity sparkline */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <svg width="100%" height="22" viewBox="0 0 120 22" preserveAspectRatio="none" style={{ flex: 1, overflow: 'visible' }}>
          <polyline
            points={series.map((v, i) => `${(i / (series.length - 1)) * 120},${22 - (v / 100) * 22}`).join(' ')}
            fill="none" stroke={statusColor} strokeWidth="1"
            opacity={o.status === 'idle' ? 0.4 : 0.85}
          />
          <circle
            cx={120} cy={22 - (series[series.length - 1] / 100) * 22}
            r="2" fill={statusColor}
            style={{ filter: o.status !== 'idle' ? `drop-shadow(0 0 3px ${statusColor})` : 'none' }}
          />
        </svg>
        <span className="meta-10" style={{ fontSize: 9, color: statusColor, minWidth: 30, textAlign: 'right' }}>
          {Math.round(series[series.length - 1])} ops/s
        </span>
      </div>

      <span style={{ fontSize: 12, color: 'var(--text-secondary)', minHeight: 30, lineHeight: 1.45 }}>{o.task}</span>

      {/* Subtasks rail */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
        {o.subtasks.map((t, i) => {
          const p = t === inProg ? animatedProgress : t.progress;
          const isActive = p > 0 && p < 100;
          return (
            <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{
                  fontFamily: 'var(--mono)', fontSize: 9,
                  color: t.done ? 'var(--ok)' : (isActive ? statusColor : 'var(--text-muted)'),
                  display: 'inline-flex', alignItems: 'center', gap: 4,
                }}>
                  <span style={{
                    display: 'inline-block',
                    transform: isActive ? `rotate(${tick * 30}deg)` : 'none',
                    transition: 'transform 200ms linear',
                  }}>{t.done ? '✓' : (isActive ? '⟳' : '○')}</span>
                  {t.name}
                </span>
                {isActive && <span className="meta-10" style={{ fontSize: 9, color: statusColor }}>{Math.round(p)}%</span>}
              </div>
              {isActive && (
                <div style={{ height: 1.5, background: 'var(--bg-base)', borderRadius: 1, overflow: 'hidden' }}>
                  <div style={{
                    width: `${p}%`, height: '100%', background: statusColor, transition: 'width 300ms',
                    boxShadow: `0 0 4px ${statusColor}`,
                  }} />
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid var(--border)', paddingTop: 8 }}>
        <span className="meta-10" style={{ color: 'var(--text-muted)' }}>PAWA</span>
        <span className="val-12" style={{ color: 'var(--text-secondary)', fontSize: 11 }}>
          {(o.pawa + Math.sin(tick * 0.3 + o.id.charCodeAt(0)) * 4).toFixed(0)} <span style={{ color: 'var(--text-muted)' }}>/ session</span>
        </span>
      </div>
    </button>
  );
}

/* Simulator panel — forked execution with scenario tree, animated DAG, state diff. */



function SimulatorPanel({ tick, sustain, leftOpen = true, rightOpen = true, onToggleLeft, onToggleRight }) {
  const [selectedBranch, setSelectedBranch] = dUseState('A2');
  const [playing, setPlaying] = dUseState(true);
  const [speed, setSpeed] = dUseState(10);
  const [activeNodes, setActiveNodes] = dUseState(new Set(['state0', 'gate0']));
  const [completedNodes, setCompletedNodes] = dUseState(new Set());

  // Step 4: Orchie expansion panel state
  const [orchieOpen, setOrchieOpen] = dUseState(false);
  const [selectedOrchieNode, setSelectedOrchieNode] = dUseState(null);

  // Step 6: Operator code editor state
  const [codeEditorOpen, setCodeEditorOpen] = dUseState(false);
  const [selectedOperator, setSelectedOperator] = dUseState(null);

  const handleOrchieExpand = (node) => {
    setSelectedOrchieNode(node);
    setOrchieOpen(true);
    setCodeEditorOpen(false); // close code editor if open
  };

  const handleOperatorClick = (node) => {
    setSelectedOperator(node);
    setCodeEditorOpen(true);
    setOrchieOpen(false); // close orchie panel if open
  };

  // Step through nodes when playing
  dUseEffect(() => {
    if (!playing) return;
    const t = setInterval(() => {
      setActiveNodes(prev => {
        const next = new Set(prev);
        const seq = SIM_NODES.map(n => n.id);
        // Find frontier — first un-activated node
        const idx = seq.findIndex(id => !next.has(id) && !completedNodes.has(id));
        if (idx === -1) {
          // Reset
          setCompletedNodes(new Set());
          return new Set(['state0', 'gate0']);
        }
        // Promote one active → completed, activate next
        const oldest = [...next][0];
        if (oldest && next.size >= 3) {
          setCompletedNodes(c => new Set([...c, oldest]));
          next.delete(oldest);
        }
        next.add(seq[idx]);
        return next;
      });
    }, 1400 / speed * 10);
    return () => clearInterval(t);
  }, [playing, speed, completedNodes]);

  const stepOnce = () => {
    setActiveNodes(prev => {
      const next = new Set(prev);
      const seq = SIM_NODES.map(n => n.id);
      const idx = seq.findIndex(id => !next.has(id) && !completedNodes.has(id));
      if (idx === -1) return prev;
      next.add(seq[idx]);
      return next;
    });
  };

  // Active edges = those connecting any active/completed node to active node
  const activePath = dUseMemo(() => [...activeNodes, ...completedNodes], [activeNodes, completedNodes]);

  return (
    <div className="panel-enter" style={{ display: 'grid', gridTemplateRows: 'auto 1fr', height: '100%', gap: 14, padding: '24px 28px' }}>
      {/* Top toolbar */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <RailToggle open={leftOpen} onClick={onToggleLeft} side="left" label="TREE" />
          <div style={{ display: 'flex', flexDirection: 'column' }}>
            <span className="label-10">SIMULATION RUN</span>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 14, color: 'var(--text-primary)' }}>SIM-{(2104 + tick % 100).toString().padStart(4, '0')} · monte_carlo · N=100</span>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ display: 'flex', gap: 4, padding: 2, background: 'var(--bg-surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)' }}>
            <PlayBtn onClick={() => setPlaying(true)}  active={playing} icon="play" />
            <PlayBtn onClick={() => setPlaying(false)} active={!playing} icon="pause" />
            <PlayBtn onClick={stepOnce} icon="step" />
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            {[1, 10, 100, 365].map(s => (
              <TBtn key={s} active={speed === s} onClick={() => setSpeed(s)}>{s}×</TBtn>
            ))}
          </div>
          <span className="meta-10" style={{ color: 'var(--text-muted)' }}>·</span>
          <PBtn variant="ghost" onClick={() => window.confirmAction?.({
            title: 'Fork new simulation branch?',
            body: 'Snapshot current branch state and create a new exploration branch.',
            ctaLabel: 'FORK',
            tone: 'amber',
            onConfirm: () => window.flash?.('Forked · branch E created · N=20', 'ok'),
          })}><Icon name="plus" size={11} /> FORK</PBtn>
          <RailToggle open={rightOpen} onClick={onToggleRight} side="right" label="DIFF" />
        </div>
      </div>

      {/* Body: 3 zones (left/right collapsible) */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: `${leftOpen ? '240px' : '0px'} minmax(0, 1fr) ${rightOpen ? '280px' : '0px'}`,
        gap: leftOpen || rightOpen ? 14 : 0,
        minHeight: 0,
        transition: 'grid-template-columns var(--t-mid), gap var(--t-mid)',
      }}>
        {/* Scenario tree */}
        {leftOpen && (
          <Card title="SCENARIO TREE" sub="4 BRANCHES" padded={false} scroll>
            <ScenarioTree
              tree={SCENARIO_TREE}
              selected={selectedBranch}
              onSelect={setSelectedBranch}
            />
          </Card>
        )}

        {/* Execution canvas */}
        <Card title="EXECUTION CANVAS" sub={`BRANCH ${selectedBranch} · DAG`} padded={false}
          actions={
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <Legend swatch="var(--node-state)" label="STATE" small />
              <Legend swatch="var(--node-operator)" label="OP" small />
              <Legend swatch="var(--node-constraint)" label="CSTR" small />
              <Legend swatch="var(--node-operative)" label="AGENT" small />
              <Legend swatch="var(--node-event)" label="EVT" small />
            </div>
          }
        >
          <SimulatorCanvas
            activeNodes={activeNodes}
            completedNodes={completedNodes}
            activePath={activePath}
            onOrchieExpand={handleOrchieExpand}
            onOperatorClick={handleOperatorClick}
            orchieOpen={orchieOpen}
            codeEditorOpen={codeEditorOpen}
            selectedOperator={selectedOperator}
            onCloseOrchie={() => setOrchieOpen(false)}
            onCloseCodeEditor={() => setCodeEditorOpen(false)}
            tick={tick}
          />
        </Card>

        {/* State Diff */}
        {rightOpen && (
          <Card title="STATE DIFF" sub={`+12 / −3`} padded scroll>
            <StateDiff tick={tick} />
          </Card>
        )}
      </div>
    </div>
  );
}

function Legend({ swatch, label, small }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
      <span style={{ width: small ? 7 : 8, height: small ? 7 : 8, background: swatch, borderRadius: 1 }} />
      <span className="label-10" style={{ fontSize: 9 }}>{label}</span>

}

function PlayBtn({ icon, active, onClick }) {
