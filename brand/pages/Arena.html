  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap');
    :root {
      --bg-base: #0f0f0f; --bg-surface: #181818; --bg-raised: #212121; --bg-overlay: #2a2a2a;
      --border: #2e2e2e; --border-mid: #3a3a3a; --border-light: #4a4a4a;
      --text-primary: #e8e4dc; --text-secondary: #8a8680; --text-muted: #565250; --text-dim: #3a3836;
      --amber: #E8A020; --amber-dim: #c07818; --amber-glow: rgba(232,160,32,0.12); --amber-border: rgba(232,160,32,0.3);

      --ok: #4caf80; --warn: #e8a020; --danger: #e05050; --info: #5090e0;
      --node-operative: #b07840; --node-operator: #5090e0; --node-state: #2ab8a0; --node-event: #e05050; --node-constraint: #a060c0;

      --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px; --t-fast: 120ms ease; --t-mid: 220ms ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg-base); color: var(--text-primary); font-family: var(--ui); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(ellipse 1400px 600px at 50% -10%, rgba(42,184,160,0.025), transparent 55%); z-index: 0; }
    #root { position: relative; z-index: 1; height: 100vh; overflow: hidden; }
    button, input { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
    .label-10 { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.10em; color: var(--text-muted); }
    .meta-10 { font-family: var(--mono); font-size: 10px; color: var(--text-secondary); }
    .meta-11 { font-family: var(--mono); font-size: 11px; color: var(--text-secondary); }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; border-radius: 10px; border: 1px solid var(--border-mid); color: var(--text-secondary); }
    .badge-operative { color: var(--node-operative); border-color: rgba(176,120,64,0.35); background: rgba(176,120,64,0.08); }
    .badge-operator  { color: var(--node-operator);  border-color: rgba(80,144,224,0.35); background: rgba(80,144,224,0.08); }
    .badge-spore     { color: var(--node-state);     border-color: var(--teal-border);    background: var(--teal-glow); }
    .badge-widget    { color: var(--node-event);     border-color: rgba(224,80,80,0.3);   background: rgba(224,80,80,0.07); }
    .badge-product   { color: var(--ok);             border-color: rgba(76,175,128,0.3);  background: rgba(76,175,128,0.08); }
    .badge-free      { color: var(--ok);             border-color: rgba(76,175,128,0.3);  background: rgba(76,175,128,0.08); }
    .badge-pawa      { color: var(--amber);          border-color: var(--amber-border);   background: var(--amber-glow); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.35s ease-out both; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; transition: border-color var(--t-fast), background var(--t-fast); cursor: pointer; }
    .card:hover { border-color: var(--border-mid); background: var(--bg-raised); }
    .trust-bar { height: 2px; background: var(--bg-overlay); border-radius: 1px; margin-top: 8px; overflow: hidden; }
    .trust-fill { height: 100%; border-radius: 1px; }
    input[type=text] { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text-primary); font-size: 12px; outline: none; transition: border-color var(--t-fast); }
    input[type=text]:focus { border-color: var(--border-mid); }

    .tab-btn { padding: 10px 16px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all var(--t-fast); }
    .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--teal); }
    .tab-btn:hover:not(.active) { color: var(--text-secondary); }
    .product-img { width: 100%; height: 120px; background: var(--bg-overlay); border-radius: var(--radius-sm); margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  </style>
</head>

/* ── Trust bar ────────────────────────────────────────────────── */
function TrustBar({ value, color }) {

/* ── Package card ─────────────────────────────────────────────── */
function PackageCard({ item, kind, inCart, onAddToCart }) {
  const badgeClass = { operative: 'badge-operative', operator: 'badge-operator', spore: 'badge-spore', widget: 'badge-widget' }[kind] || '';
  const accentColor = { operative: 'var(--node-operative)', operator: 'var(--node-operator)', spore: 'var(--teal)', widget: 'var(--node-event)' }[kind] || 'var(--teal)';
  const isFree = item.pawa === 'FREE';
  return (
    <div className="card fade-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
        <div>
          <span className={`badge ${badgeClass}`} style={{ marginBottom: 6, display: 'inline-flex' }}>{kind.toUpperCase()}</span>
          <div style={{ fontFamily: 'var(--ui)', fontSize: 14, fontWeight: 600, color: 'var(--text-primary)', lineHeight: 1.3 }}>{item.name}</div>
          <div className="meta-10" style={{ marginTop: 2 }}>{item.author} · v{item.version}</div>
        </div>
        <span className={`badge ${isFree ? 'badge-free' : 'badge-pawa'}`} style={{ flexShrink: 0, marginLeft: 8 }}>
          {isFree ? 'FREE' : `${item.pawa} PWA`}
        </span>
      </div>
      <p style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 10, minHeight: 54 }}>{item.desc}</p>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span className="meta-10">{item.downloads?.toLocaleString()} installs</span>
        <span className="meta-10" style={{ color: accentColor }}>{item.trust}% trust</span>
      </div>
      <TrustBar value={item.trust} color={accentColor} />
      {item.tags && (
        <div style={{ display: 'flex', gap: 4, marginTop: 8, flexWrap: 'wrap' }}>
          {item.tags.slice(0, 3).map(t => <span key={t} className="badge">{t}</span>)}

      )}
      <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'flex-end' }}>

            <span style={{ fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--text-primary)', minWidth: 20, textAlign: 'center' }}>{cartItem.qty}</span>

          <button onClick={() => onAdd(item, 'product')} style={{ flex: 1, padding: '7px 12px', fontFamily: 'var(--mono)', fontSize: 9, fontWeight: 500, letterSpacing: '0.06em', color: isVyyb ? 'var(--amber)' : 'var(--ok)', background: isVyyb ? 'var(--amber-glow)' : 'rgba(76,175,128,0.08)', border: `1px solid ${isVyyb ? 'var(--amber-border)' : 'rgba(76,175,128,0.3)'}`, borderRadius: 'var(--radius-sm)', cursor: 'pointer', transition: 'all var(--t-fast)' }}>
            + ADD TO CART

        )}
      </div>
    </div>
  );
}

/* ── Status timeline ─────────────────────────────────────────── */
const PACKAGE_STAGES = ['PLACED', 'INSTALLING', 'SANDBOXED', 'LIVE'];
const PRODUCT_STAGES  = ['PLACED', 'PROCESSING', 'DELIVERING', 'DELIVERED'];

function StatusTimeline({ stages, currentStage }) {
  const currentIdx = stages.indexOf(currentStage);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-start', marginTop: 10 }}>
      {stages.map((s, i) => {
        const done    = i < currentIdx;
        const active  = i === currentIdx;
        return (
          <React.Fragment key={s}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, minWidth: 0 }}>
              <div style={{
                width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
                background: done ? 'var(--ok)' : active ? 'var(--teal)' : 'var(--bg-overlay)',
                border: `1.5px solid ${done ? 'var(--ok)' : active ? 'var(--teal)' : 'var(--border)'}`,
                boxShadow: active ? '0 0 6px rgba(42,184,160,0.4)' : 'none',
              }} />
              <span style={{
                fontFamily: 'var(--mono)', fontSize: 7, letterSpacing: '0.06em', textAlign: 'center',
                color: active ? 'var(--teal)' : done ? 'var(--ok)' : 'var(--text-dim)',
                whiteSpace: 'nowrap',
              }}>{s}</span>
            </div>
            {i < stages.length - 1 && (
              <div style={{ flex: 1, height: 1, marginTop: 4, background: done ? 'var(--ok)' : 'var(--border)', minWidth: 12 }} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

/* ── Order card ───────────────────────────────────────────────── */
function OrderCard({ order }) {

  const packages  = order.items.filter(i => i.kind !== 'product');
  return (
    <div className="card fade-up" style={{ marginBottom: 10, cursor: 'default' }}>
      {/* Header row */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
        <div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)', letterSpacing: '0.08em', marginBottom: 3 }}>REF · {order.ref}</div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)' }}>{order.date} · {order.time}</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          {order.productTotal > 0 && <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-secondary)' }}>KES {order.productTotal.toLocaleString()}</div>}
          {order.paidPwaTotal > 0 && <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--amber)' }}>{order.paidPwaTotal} PWA</div>}

            Delivery · {products.length} item{products.length > 1 ? 's' : ''}
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 2 }}>
            {products.map((p, i) => (
              <span key={i} style={{ fontFamily: 'var(--ui)', fontSize: 11, color: 'var(--text-muted)' }}>

      {/* Packages section */}
      {packages.length > 0 && (
        <div style={{
          marginTop: products.length > 0 ? 14 : 0,
          paddingTop: products.length > 0 ? 14 : 0,
          borderTop: products.length > 0 ? '1px solid var(--border)' : 'none',
        }}>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-dim)', letterSpacing: '0.1em', marginBottom: 6, textTransform: 'uppercase' }}>

            {packages.map((p, i) => (

      )}

}

          <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-primary)', minWidth: 18, textAlign: 'center' }}>{item.qty}</span>
          <button onClick={() => onQty(1)} style={{ width: 22, height: 22, fontFamily: 'var(--mono)', fontSize: 14, color: 'var(--text-muted)', background: 'var(--bg-raised)', border: '1px solid var(--border)', borderRadius: 3, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>+</button>
        </div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 3, flexShrink: 0 }}>
        {item.kind === 'product' && <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-secondary)' }}>KES {(item.price * item.qty).toLocaleString()}</span>}
        <button onClick={onRemove} style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-dim)', background: 'none', border: 'none', cursor: 'pointer', padding: 0, transition: 'color var(--t-fast)' }}
          onMouseEnter={e => e.currentTarget.style.color = 'var(--danger)'}

}

/* ── Cart drawer ──────────────────────────────────────────────── */
function CartDrawer({ open, onClose, cart, onUpdateQty, onRemove, onClear, onOrderPlaced }) {
  const [step, setStep] = useState('cart');
  const [sustain, setSustain] = useState('Sustena XII');
  const [deliveryAddr, setDeliveryAddr] = useState('');
  const [deliveryPhone, setDeliveryPhone] = useState('');
  const [payMethod, setPayMethod] = useState('till');
  const [tillPhone, setTillPhone] = useState('');
  const [globalPhone, setGlobalPhone] = useState('');
  const [cardNo, setCardNo] = useState('');
  const [cardExp, setCardExp] = useState('');
  const [cardCvv, setCardCvv] = useState('');
  const [orderRef, setOrderRef] = useState('');
  const [licenses, setLicenses] = useState([]);

  useEffect(() => {
    if (!open) { const t = setTimeout(() => setStep('cart'), 350); return () => clearTimeout(t); }
  }, [open]);

  const products  = cart.filter(c => c.kind === 'product');
  const packages  = cart.filter(c => c.kind !== 'product');
  const productTotal  = products.reduce((s, c) => s + c.price * c.qty, 0);
  const paidPackages  = packages.filter(c => c.pawa !== 'FREE');
  const freePackages  = packages.filter(c => c.pawa === 'FREE');
  const paidPwaTotal  = paidPackages.reduce((s, c) => s + Number(c.pawa), 0);
  const needsPay      = productTotal > 0 || paidPwaTotal > 0;

  const STEPS = ['CART', 'SETUP', 'PAYMENT'];
  const stepIdx = { cart: 0, setup: 1, payment: 2, done: 3 }[step] ?? 0;

  function handleConfirm() {
    const ref = 'SXI-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    const lic = paidPackages.map(c => ({ name: c.name, key: 'LIC-' + Math.random().toString(36).slice(2, 10).toUpperCase() }));
    const now = new Date();
    const dateStr = now.toISOString().slice(0, 10);
    const timeStr = now.toTimeString().slice(0, 5);
    setOrderRef(ref);
    setLicenses(lic);
    if (onOrderPlaced) {
      onOrderPlaced({
        ref, date: dateStr, time: timeStr,
        items: [...cart],
        sustain,
        productTotal, paidPwaTotal,
        productStatus: products.length > 0 ? 'PLACED' : null,
        packageStatus: packages.length > 0 ? 'PLACED' : null,
        deliveryAddr, payMethod,
        licenses: lic,
      });
    }
    setStep('done');
    onClear();
  }

  const PAY_METHODS = [
    { id: 'till',   label: 'M-PESA TILL',   sub: 'STK push' },
    { id: 'global', label: 'M-PESA GLOBAL', sub: 'International' },
    { id: 'card',   label: 'CARD',          sub: 'Visa · MC' },
  ];
  const SUSTAINS = ['Sustena XII', 'Vyyb', 'Chama XII'];

  const inputStyle = { width: '100%', fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-primary)', background: 'var(--bg-base)', border: '1px solid var(--border-mid)', borderRadius: 'var(--radius-sm)', padding: '10px 12px', outline: 'none' };
  const sectionLabel = { fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--text-dim)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 12 };

  return (
    <>
      {open && <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 799, background: 'rgba(0,0,0,0.5)' }} />}
      <div style={{
        position: 'fixed', top: 0, right: 0, bottom: 0,
        width: 'clamp(320px, 32vw, 420px)', zIndex: 800,
        background: 'var(--bg-surface)', borderLeft: '1px solid var(--border-mid)',
        display: 'flex', flexDirection: 'column',
        transform: open ? 'translateX(0)' : 'translateX(100%)',
        transition: 'transform 0.32s cubic-bezier(0.22,0.61,0.36,1)',
      }}>

        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px 24px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', color: 'var(--text-primary)' }}>
            {step === 'done' ? 'ORDER CONFIRMED' : `CART${cart.length > 0 ? ` · ${cart.length}` : ''}`}
          </span>
          <button onClick={onClose} style={{ color: 'var(--text-muted)', padding: 4, background: 'none', border: 'none', cursor: 'pointer' }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M2 2L12 12M12 2L2 12"/></svg>
          </button>
        </div>

        {/* Step bar */}
        {step !== 'done' && (
          <div style={{ display: 'flex', padding: '0 24px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
            {STEPS.map((s, i) => (
              <div key={s} style={{ padding: '8px 0', marginRight: 20, fontFamily: 'var(--mono)', fontSize: 8, letterSpacing: '0.1em', color: i <= stepIdx ? 'var(--text-secondary)' : 'var(--text-dim)', borderBottom: i === stepIdx ? '1px solid var(--teal)' : '1px solid transparent' }}>{s}</div>
            ))}
          </div>
        )}

        {/* Scrollable content */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '20px 24px' }}>

          {/* ── CART STEP ── */}
          {step === 'cart' && (cart.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '60px 0', fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-muted)' }}>CART EMPTY</div>
          ) : (
            <>
              {packages.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={sectionLabel}>PACKAGES ({packages.length})</div>
                  {packages.map(c => <CartRow key={c.cartId} item={c} onRemove={() => onRemove(c.cartId)} />)}
                </div>
              )}
              {products.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={sectionLabel}>PRODUCTS ({products.length})</div>
                  {products.map(c => <CartRow key={c.cartId} item={c} onRemove={() => onRemove(c.cartId)} onQty={d => onUpdateQty(c.cartId, d)} />)}
                </div>
              )}
              <div style={{ borderTop: '1px solid var(--border)', paddingTop: 14 }}>
                {productTotal > 0 && <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}><span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)' }}>Products</span><span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-secondary)' }}>KES {productTotal.toLocaleString()}</span></div>}
                {paidPwaTotal > 0 && <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}><span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)' }}>Paid packages</span><span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--amber)' }}>{paidPwaTotal} PWA</span></div>}
                {freePackages.length > 0 && <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}><span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)' }}>Free packages</span><span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--ok)' }}>{freePackages.length} × FREE</span></div>}
              </div>
            </>
          ))}

          {/* ── SETUP STEP ── */}
          {step === 'setup' && (
            <>
              {packages.length > 0 && (
                <div style={{ marginBottom: 28 }}>
                  <div style={sectionLabel}>INSTALL TARGET</div>
                  <div style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-muted)', marginBottom: 12 }}>Select the sustain to install {packages.length} package{packages.length > 1 ? 's' : ''} into:</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {SUSTAINS.map(s => (
                      <button key={s} onClick={() => setSustain(s)} style={{ width: '100%', textAlign: 'left', padding: '10px 14px', fontFamily: 'var(--mono)', fontSize: 11, color: sustain === s ? 'var(--text-primary)' : 'var(--text-muted)', background: sustain === s ? 'var(--bg-raised)' : 'transparent', border: `1px solid ${sustain === s ? 'var(--border-mid)' : 'var(--border)'}`, borderRadius: 'var(--radius-sm)', cursor: 'pointer', transition: 'all var(--t-fast)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        {s}{sustain === s && <span style={{ color: 'var(--teal)' }}>✓</span>}
                      </button>
                    ))}
                  </div>
                  <div style={{ marginTop: 10, fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)', lineHeight: 1.6 }}>Packages run in 24h sandbox before going live. Licenses issued at payment.</div>
                </div>
              )}
              {products.length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={sectionLabel}>DELIVERY</div>
                  <div style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-muted)', marginBottom: 12 }}>Estimated ETA: 30–45 min within 2km.</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <input style={inputStyle} value={deliveryAddr} onChange={e => setDeliveryAddr(e.target.value)} placeholder="Delivery address or landmark…" />
                    <input style={inputStyle} value={deliveryPhone} onChange={e => setDeliveryPhone(e.target.value)} placeholder="Phone for delivery updates (0700…)" />
                  </div>
                </div>
              )}
            </>
          )}

          {/* ── PAYMENT STEP ── */}
          {step === 'payment' && (
            <>
              <div style={{ marginBottom: 24 }}>
                <div style={sectionLabel}>ORDER SUMMARY</div>
                {cart.map(c => (
                  <div key={c.cartId} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                    <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)' }}>{c.qty > 1 ? `${c.qty}× ` : ''}{c.name}</span>
                    <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-secondary)' }}>{c.kind === 'product' ? `KES ${(c.price * c.qty).toLocaleString()}` : c.pawa === 'FREE' ? 'FREE' : `${c.pawa} PWA`}</span>
                  </div>
                ))}
                <div style={{ borderTop: '1px solid var(--border)', paddingTop: 10, marginTop: 8 }}>
                  {productTotal > 0 && <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}><span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, color: 'var(--text-secondary)' }}>TOTAL</span><span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, color: 'var(--text-primary)' }}>KES {productTotal.toLocaleString()}</span></div>}
                  {paidPwaTotal > 0 && <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, color: 'var(--amber)' }}>PAWA</span><span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, color: 'var(--amber)' }}>{paidPwaTotal} PWA</span></div>}
                </div>
              </div>

              {needsPay && (
                <div style={{ marginBottom: 20 }}>
                  <div style={sectionLabel}>PAYMENT METHOD</div>
                  <div style={{ display: 'flex', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', overflow: 'hidden', marginBottom: 16 }}>
                    {PAY_METHODS.map((m, mi) => (
                      <button key={m.id} onClick={() => setPayMethod(m.id)} style={{ flex: 1, padding: '10px 4px', fontFamily: 'var(--mono)', fontSize: 8, letterSpacing: '0.06em', color: payMethod === m.id ? 'var(--text-primary)' : 'var(--text-muted)', background: payMethod === m.id ? 'var(--bg-raised)' : 'transparent', border: 'none', borderRight: mi < 2 ? '1px solid var(--border)' : 'none', cursor: 'pointer', transition: 'all var(--t-fast)', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                        <span style={{ fontWeight: 600 }}>{m.label}</span>
                        <span style={{ fontSize: 7, color: 'var(--text-dim)', fontFamily: 'var(--ui)' }}>{m.sub}</span>
                      </button>
                    ))}
                  </div>
                  {payMethod === 'till' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <input style={inputStyle} value={tillPhone} onChange={e => setTillPhone(e.target.value)} placeholder="Your M-Pesa phone (0700…)" />
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)', lineHeight: 1.6 }}>STK push to confirm KES {productTotal.toLocaleString()} · Till 247247. Approve on your phone to complete.</div>
                    </div>
                  )}
                  {payMethod === 'global' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <input style={inputStyle} value={globalPhone} onChange={e => setGlobalPhone(e.target.value)} placeholder="International number (+254…)" />
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)', lineHeight: 1.6 }}>M-Pesa Global Pay — cross-border. Enter your registered M-Pesa number.</div>
                    </div>
                  )}
                  {payMethod === 'card' && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <input style={{ ...inputStyle, fontFamily: 'var(--mono)', letterSpacing: '0.12em' }} value={cardNo} onChange={e => setCardNo(e.target.value)} placeholder="Card number" />
                      <div style={{ display: 'flex', gap: 8 }}>
                        <input style={{ ...inputStyle, fontFamily: 'var(--mono)' }} value={cardExp} onChange={e => setCardExp(e.target.value)} placeholder="MM / YY" />
                        <input style={{ ...inputStyle, width: 80, fontFamily: 'var(--mono)' }} value={cardCvv} onChange={e => setCardCvv(e.target.value)} placeholder="CVV" />
                      </div>
                    </div>
                  )}
                </div>
              )}
            </>
          )}

          {/* ── DONE STEP ── */}
          {step === 'done' && (
            <>
              <div style={{ textAlign: 'center', padding: '24px 0 20px' }}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 36, color: 'var(--teal)', marginBottom: 10 }}>✓</div>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 700, letterSpacing: '0.1em', color: 'var(--text-primary)', marginBottom: 4 }}>ORDER PLACED</div>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)', letterSpacing: '0.06em' }}>ref · {orderRef}</div>
              </div>
              {packages.length > 0 && (
                <div style={{ background: 'var(--bg-raised)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', padding: '14px 16px', marginBottom: 12 }}>
                  <div style={sectionLabel}>PACKAGES → {sustain}</div>
                  {packages.map(c => (
                    <div key={c.cartId} style={{ marginBottom: 10, paddingBottom: 10, borderBottom: '1px solid var(--border)' }}>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-secondary)', marginBottom: 3 }}>{c.name}</div>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)' }}>Sandbox trial · 24h before live</div>
                      {licenses.find(l => l.name === c.name) && (
                        <div style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--amber)', marginTop: 5, letterSpacing: '0.06em' }}>LICENSE · {licenses.find(l => l.name === c.name).key}</div>
                      )}
                    </div>
                  ))}
                </div>
              )}
              {products.length > 0 && (
                <div style={{ background: 'var(--bg-raised)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', padding: '14px 16px' }}>
                  <div style={sectionLabel}>DELIVERY</div>
                  <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-primary)', marginBottom: 4 }}>ETA 30–45 min</div>
                  <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)' }}>KES {productTotal.toLocaleString()} · {payMethod === 'till' ? 'M-Pesa Till' : payMethod === 'global' ? 'M-Pesa Global' : 'Card'}</div>
                  {deliveryAddr && <div style={{ fontFamily: 'var(--ui)', fontSize: 11, color: 'var(--text-muted)', marginTop: 6 }}>{deliveryAddr}</div>}
                </div>
              )}
            </>
          )}
        </div>

        {/* Footer CTA */}
        <div style={{ padding: '16px 24px', borderTop: '1px solid var(--border)', flexShrink: 0 }}>
          {step === 'cart' && (
            <button onClick={() => cart.length > 0 && setStep('setup')} style={{ width: '100%', padding: '12px', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: cart.length === 0 ? 'var(--text-dim)' : '#000', background: cart.length === 0 ? 'var(--bg-raised)' : 'var(--teal)', border: 'none', borderRadius: 'var(--radius-sm)', cursor: cart.length === 0 ? 'default' : 'pointer', transition: 'all var(--t-fast)' }}>
              CONTINUE TO SETUP →
            </button>
          )}
          {step === 'setup' && (
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => setStep('cart')} style={{ padding: '12px 16px', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', background: 'var(--bg-raised)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', cursor: 'pointer' }}>← BACK</button>
              <button onClick={() => setStep('payment')} style={{ flex: 1, padding: '12px', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: '#000', background: 'var(--teal)', border: 'none', borderRadius: 'var(--radius-sm)', cursor: 'pointer' }}>CONTINUE TO PAYMENT →</button>
            </div>
          )}
          {step === 'payment' && (
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => setStep('setup')} style={{ padding: '12px 16px', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', background: 'var(--bg-raised)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', cursor: 'pointer' }}>← BACK</button>
              <button onClick={handleConfirm} style={{ flex: 1, padding: '12px', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: '#000', background: needsPay ? 'var(--ok)' : 'var(--teal)', border: 'none', borderRadius: 'var(--radius-sm)', cursor: 'pointer' }}>
                {productTotal > 0 ? `PAY KES ${productTotal.toLocaleString()} →` : paidPwaTotal > 0 ? `SPEND ${paidPwaTotal} PWA →` : 'INSTALL FREE →'}
              </button>
            </div>
          )}
          {step === 'done' && (
            <button onClick={onClose} style={{ width: '100%', padding: '12px', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', color: 'var(--text-primary)', background: 'var(--bg-raised)', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', cursor: 'pointer' }}>CLOSE</button>
          )}
        </div>
      </div>
    </>
  );
}

/* ── Arena page ───────────────────────────────────────────────── */
function ArenaPage() {
  const [tab, setTab] = useState('operatives');
  const [search, setSearch] = useState('');
  const [productFilter, setProductFilter] = useState('all');
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [orders, setOrders] = useState(INITIAL_ORDERS);

  function addOrder(order) { setOrders(prev => [order, ...prev]); }

  function addToCart(item, kind) {
    setCart(prev => {
      const existing = prev.find(c => c.itemId === item.id);
      if (existing) {
        if (kind === 'product') return prev.map(c => c.itemId === item.id ? { ...c, qty: c.qty + 1 } : c);
        return prev;
      }
      return [...prev, { cartId: `${item.id}-${Date.now()}`, itemId: item.id, name: item.name, kind, pawa: item.pawa, price: item.price || 0, unit: item.unit || null, qty: 1, emoji: item.emoji || null }];
    });
  }

  function updateQty(cartId, delta) {
    setCart(prev => prev.map(c => c.cartId === cartId ? { ...c, qty: c.qty + delta } : c).filter(c => c.qty > 0));
  }

  function removeFromCart(cartId) { setCart(prev => prev.filter(c => c.cartId !== cartId)); }
  function clearCart() { setCart([]); }

  const cartSet = useMemo(() => new Set(cart.map(c => c.itemId)), [cart]);
  const cartMap = useMemo(() => Object.fromEntries(cart.map(c => [c.itemId, c])), [cart]);
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  const TABS = [
    { id: 'operatives', label: 'Operatives', count: OPERATIVES.length,    accent: 'var(--node-operative)' },
    { id: 'operators',  label: 'Operators',  count: OPERATORS.length,     accent: 'var(--node-operator)' },
    { id: 'spores',     label: 'Spores',     count: SPORES.length,        accent: 'var(--teal)' },
    { id: 'widgets',    label: 'Widgets',    count: WIDGETS.length,       accent: 'var(--node-event)' },
    { id: 'products',   label: 'Products',   count: PRODUCTS_ALL.length,  accent: 'var(--ok)' },
    { id: 'orders',     label: 'My Orders',  count: orders.length,        accent: 'var(--text-secondary)' },
  ];

  const q = search.toLowerCase().trim();

  const filtered = useMemo(() => {
    const pool = { operatives: OPERATIVES, operators: OPERATORS, spores: SPORES, widgets: WIDGETS, products: PRODUCTS_ALL }[tab] || [];
    let results = q ? pool.filter(i => i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q) || (i.tags || []).some(t => t.includes(q))) : pool;
    if (tab === 'products' && productFilter !== 'all') results = results.filter(i => i.source === productFilter);
    return results;
  }, [tab, q, productFilter]);

  const activeTab = TABS.find(t => t.id === tab);

  return (
    <div style={{ display: 'grid', gridTemplateRows: '44px auto 1fr', height: '100vh', padding: '0 48px' }}>
      {/* Top nav */}
      <header style={{ borderBottom: '1px solid var(--border)', background: 'var(--bg-surface)', display: 'flex', alignItems: 'stretch', padding: '0 20px', gap: 0, flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, paddingRight: 20, borderRight: '1px solid var(--border)' }}>
          <div style={{ width: 22, height: 22, borderRadius: '50%', border: '1.5px solid var(--teal)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--teal)' }} />
          </div>
          <div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 500, letterSpacing: '0.08em', color: 'var(--text-primary)' }}>ARENA</div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-muted)', letterSpacing: '0.06em' }}>mycelium.network</div>
          </div>
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          {[
            { label: 'BLOG',  href: 'blog.html'  },
            { label: 'ARENA', href: '#',           active: true },
            { label: 'DOCS',  href: 'docs.html'   },
          ].map(({ label, href, active: isActive }) => (
            <a key={label} href={href} style={{
              display: 'flex', alignItems: 'center', height: '100%', padding: '0 14px',
              fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 500, letterSpacing: '0.08em',
              color: isActive ? 'var(--teal)' : 'var(--text-muted)',
              borderBottom: isActive ? '2px solid var(--teal)' : '2px solid transparent',
              textDecoration: 'none', transition: 'color var(--t-fast)',
            }}>{label}</a>
          ))}
          <div style={{ width: 1, height: 20, background: 'var(--border)', margin: '0 8px' }} />
          {/* Cart button */}
          <button onClick={() => setCartOpen(true)} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 12px', fontFamily: 'var(--mono)', fontSize: 10, color: cartCount > 0 ? 'var(--teal)' : 'var(--text-muted)', background: cartCount > 0 ? 'var(--teal-glow)' : 'transparent', border: `1px solid ${cartCount > 0 ? 'var(--teal-border)' : 'var(--border)'}`, borderRadius: 'var(--radius-sm)', cursor: 'pointer', transition: 'all var(--t-fast)' }}>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M1 1h2l2 8h8l1-5H5"/><circle cx="7" cy="13.5" r="0.8" fill="currentColor"/><circle cx="12" cy="13.5" r="0.8" fill="currentColor"/></svg>
            CART{cartCount > 0 ? ` · ${cartCount}` : ''}
          </button>
          <div style={{ width: 1, height: 20, background: 'var(--border)', margin: '0 8px' }} />
          <a href="Sustena Dashboard.html" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 10px', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', textDecoration: 'none', border: '1px solid var(--border)', borderRadius: 'var(--radius-sm)', transition: 'all var(--t-fast)' }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--border-mid)'; e.currentTarget.style.color = 'var(--text-secondary)'; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-muted)'; }}>
            ← DASHBOARD
          </a>
        </div>
      </header>

      {/* Sub-header: search + tabs */}
      <div style={{ background: 'var(--bg-surface)', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
        {/* Hero strip */}
        <div style={{ padding: '16px 28px 0', display: 'flex', alignItems: 'center', gap: 20 }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 4 }}>
              <h1 style={{ fontFamily: 'var(--ui)', fontSize: 20, fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--text-primary)' }}>Mycelium</h1>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-muted)' }}>the open network</span>
            </div>
            <p style={{ fontFamily: 'var(--ui)', fontSize: 12, color: 'var(--text-muted)', maxWidth: 560 }}>
              Operatives, operators, sustain spores, widgets — and real-world products from Vyyb food businesses and Mkulima farms across Kenya. Free to browse. Pawa to install.
            </p>
          </div>
          {tab !== 'orders' && <SearchBar value={search} onChange={setSearch} />}
        </div>
        {/* Tabs */}
        <div style={{ display: 'flex', gap: 0, paddingLeft: 16, marginTop: 8 }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`tab-btn ${tab === t.id ? 'active' : ''}`}
              style={{ borderBottomColor: tab === t.id ? t.accent : 'transparent', color: tab === t.id ? 'var(--text-primary)' : 'var(--text-muted)' }}>
              {t.label} <span style={{ marginLeft: 4, fontFamily: 'var(--mono)', fontSize: 9, color: 'var(--text-dim)' }}>{t.count}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Main content */}
      <div style={{ overflowY: 'auto', padding: '24px 28px' }}>
        {tab === 'orders' ? (
          <OrdersView orders={orders} />
        ) : (
          <>
            <div style={{ marginBottom: 16, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <span style={{ fontFamily: 'var(--ui)', fontSize: 15, fontWeight: 600, color: 'var(--text-primary)' }}>{filtered.length}</span>
                <span style={{ fontFamily: 'var(--ui)', fontSize: 13, color: 'var(--text-muted)', marginLeft: 6 }}>{tab}{q ? ` matching "${search}"` : ''}</span>
              </div>
              {tab !== 'products' && (
                <span className="meta-10">sorted by trust</span>
              )}
            </div>

            {tab === 'products' && <ProductBar filter={productFilter} onFilter={setProductFilter} />}

            {filtered.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '80px 20px', color: 'var(--text-muted)' }}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 11, marginBottom: 8 }}>NO RESULTS</div>
                <div style={{ fontSize: 12 }}>Try a different search term</div>
              </div>
            ) : tab === 'products' ? (
              <div className="card-grid">
                {filtered.map(item => <ProductCard key={item.id} item={item} cartItem={cartMap[item.id]} onAdd={addToCart} onQty={updateQty} />)}
              </div>
            ) : (
              <div className="card-grid">
                {filtered.map(item => <PackageCard key={item.id} item={item} kind={tab.slice(0, -1)} inCart={cartSet.has(item.id)} onAddToCart={() => addToCart(item, tab.slice(0, -1))} />)}
              </div>
            )}
          </>
        )}
      </div>

      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cart} onUpdateQty={updateQty} onRemove={removeFromCart} onClear={clearCart} onOrderPlaced={addOrder} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ArenaPage />);
</script>
</body>
</html>
