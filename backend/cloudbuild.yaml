steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/sustena-xii:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/sustena-xii:latest"
      - "."

  # Step 2: Push to Google Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/sustena-xii:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/sustena-xii:latest"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "sustena-xii"
      - "--image"
      - "gcr.io/$PROJECT_ID/sustena-xii:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      - "--memory"
      - "512Mi"
      - "--set-secrets"
      - "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,WHATSAPP_TOKEN=WHATSAPP_TOKEN:latest,WHATSAPP_PHONE_ID=WHATSAPP_PHONE_ID:latest,SECRET_KEY=SECRET_KEY:latest,ADMIN_TOKEN=ADMIN_TOKEN:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest"
      - "--set-env-vars"
      - "ENVIRONMENT=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID"

images:
  - "gcr.io/$PROJECT_ID/sustena-xii:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/sustena-xii:latest"
