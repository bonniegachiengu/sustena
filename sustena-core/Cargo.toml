[package]
name = "sustena-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The portable Sustena engine core — state, fold, rules, operators, council."
license = "Apache-2.0"
repository = "https://github.com/bonniegachiengu/sustena"

# Compiles to every surface Sustena needs (ADR-0001, Decision 1):
#   rlib     — the server and tests
#   cdylib   — Android (JNI/uniffi) and iOS
#   staticlib— desktop linking
# WASM comes from the same source via wasm32-unknown-unknown; nothing here is
# platform-specific, which is the point of keeping I/O out of the core.
[lib]
name = "sustena_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
# Conformance vectors are plain JSON read from disk; no extra harness needed.

[profile.release]
opt-level = 3
lto = true
