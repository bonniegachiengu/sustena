# Sustena — locked Python dependencies (exact pins)
#
# WHY THIS FILE EXISTS
# --------------------
# requirements.txt declares the DIRECT dependencies with `>=` ranges, which is
# right for humans but means two installs on different days resolve to
# different versions. The 2,161-test suite is the correctness oracle for the
# Rust engine port (ADR-0001, Decision 1) — an oracle whose answer depends on
# install date is not an oracle. This file pins the exact, verified-green set.
#
# USE
# ---
#   pip install -r requirements.lock     # reproducible — CI and the port oracle
#   pip install -r requirements.txt      # loose — day-to-day dev only
#
# REGENERATE (after deliberately changing requirements.txt)
# --------------------------------------------------------
#   1. rebuild a venv from requirements.txt
#   2. run the full suite — it must be green BEFORE it becomes the lock
#   3. python -E -m pip freeze | sort -f > requirements.lock   (re-add this header)
#
# NOTE ON `python -E`
# -------------------
# The -E flag is REQUIRED here, not decorative. This machine has a system-wide
# PYTHONPATH pointing at an unrelated local project, which a plain `pip freeze`
# picks up and emits as a phantom pin that does not exist on PyPI — that would
# break every `pip install -r` including CI. -E ignores it.
#
# Verified green: 2,161 tests, Python 3.11.7.
