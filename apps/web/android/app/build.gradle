apply plugin: 'com.android.application'

android {
    // namespace is the Java/Kotlin source package (must match the actual
    // online/vyybandasky/sustena/ source folder) -- it does NOT need to
    // match applicationId, the Play-Store-facing unique app ID, below.
    namespace = "online.vyybandasky.sustena"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Was "online.vyybandasky.sustena" -- changed to rule out any
        // leftover partial-install state from the first ("App not
        // installed") attempt colliding with a retry, and to be the real,
        // specific app ID rather than the bare domain-reversed default
        // `cap init` generated.
        applicationId "online.vyybandasky.sustena.orchie"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Explicit debug signing config -- the FIRST build relied on AGP's
    // implicit default debug config, which (verified via `apksigner verify
    // --verbose` on that APK) signed with v2 ONLY (v1/JAR signing: false).
    // v2-only is spec-legitimate for minSdk>=24 and apksigner reported the
    // APK as valid, so this probably wasn't the actual install failure --
    // but MIUI's own security/install scanner is known to be stricter and
    // less standards-faithful than stock AOSP's verifier, so forcing BOTH
    // v1 and v2 here is a real, no-cost belt-and-suspenders fix against
    // exactly that class of OEM quirk, using the same auto-generated
    // ~/.android/debug.keystore Gradle already created for the first build.
    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WorkManager -- IngestWorker.java, enqueued directly from SmsReceiver
    // so a real bank SMS is captured+classified+notified natively, near-
    // immediately, regardless of whether the app process is even running.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
