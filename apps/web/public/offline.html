<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Sustena — offline</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0f0f0f; color: #9a9a9a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center;
      }
      .card { text-align: center; padding: 24px; max-width: 360px; }
      .mark {
        width: 48px; height: 48px; margin: 0 auto 20px;
        border: 1.5px solid #E8A020; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        color: #E8A020; font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500;
      }
      h1 {
        font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
        color: #e5e5e5; font-weight: 500; margin: 0 0 8px;
      }
      p { font-size: 13px; line-height: 1.6; margin: 0 0 20px; color: #7a7a7a; }
      button {
        font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
        color: #0f0f0f; background: #E8A020; border: none;
        padding: 8px 18px; border-radius: 4px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">S</div>
      <h1>offline · sustena unreachable</h1>
      <p>
        no connection to the server — nothing here is live right now.
        this is not showing you old data as current; it isn't showing
        you data at all. reconnect and reload to pick up where you left off.
      </p>
      <button onclick="location.reload()">RETRY</button>
    </div>
  </body>
</html>
