[package]
name = "mycelium"
version = "0.1.0"
description = "Mycelium — the Sustena cockpit. A Tauri v2 host with sustena-core compiled in."
edition = "2021"
rust-version = "1.82"
# The helper bins (export_bindings, smoke) make a bare `cargo run` ambiguous.
default-run = "mycelium"

[lib]
name = "mycelium_lib"
# Desktop-only for now: a plain rlib. The mobile crate-types
# ("staticlib", "cdylib") are added back when Orchie's mobile target lands --
# with them on, an integration test binary fails to load on Windows with
# STATUS_ENTRYPOINT_NOT_FOUND, and the bindings ARE generated by a test.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ★★★ The engine, compiled straight into the host. Not a network hop, not a
# server — the same crate `examples/household_run.rs` drives, linked in.
sustena-core = { path = "../../../sustena-core" }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# ★★ The typed boundary. See `dto.rs` for why these live HERE and not in the
# core: ADR-0001 fixes the core's dependencies at serde/serde_json/thiserror.
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

[features]
# Writes `src/bindings.ts` on `cargo test --features generate-bindings`.
generate-bindings = []
