[package]
name = "mycelium"
version = "0.3.1"
description = "Mycelium ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â the Sustena cockpit. A Tauri v2 host with sustena-core compiled in."
edition = "2021"
rust-version = "1.82"

[lib]
name = "mycelium_lib"
# ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ **The mobile crate-types are back, and the note that removed them was
#     re-tested rather than inherited.** An earlier slice recorded that
#     `cdylib`/`staticlib` made a Windows integration-test binary fail to load
#     with STATUS_ENTRYPOINT_NOT_FOUND -- a real observation at the time, and
#     the kind of note that quietly becomes folklore. Android needs
#     `libmycelium_lib.so`, so the claim had to be checked: the full Windows
#     host suite was re-run with all three on. See the commit for the result.
crate-type = ["staticlib", "cdylib", "rlib"]

# ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ **The helper bins are gated, and the reason is what the installer
#     shipped.** `src/bin/` is auto-discovered, so a release build produced
#     `export_bindings.exe` and `smoke.exe` alongside the app ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â and Tauri
#     bundles what it finds in `target/release`, so the first NSIS package
#     genuinely installed a bindings generator onto a person's machine.
#     Declaring them with `required-features` keeps them out of a default
#     build; they are still one flag away for the two things that need them.
#
# ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ `smoke` in particular writes to a scratch store and prints an engine
#   walkthrough. It is a proof, not a product, and it has no business in a
#   Start menu.
[[bin]]
name = "mycelium"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
required-features = ["dev-bins"]

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = ["dev-bins"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ The engine, compiled straight into the host. Not a network hop, not a
# server ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â the same crate `examples/household_run.rs` drives, linked in.
sustena-core = { path = "../../../sustena-core" }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ The typed boundary. See `dto.rs` for why these live HERE and not in the
# core: ADR-0001 fixes the core's dependencies at serde/serde_json/thiserror.
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
# ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ÃƒÂ¢Ã‹Å“Ã¢â‚¬Â¦ The session layer. `x25519` for the ephemeral key exchange and `hkdf`
# to turn its output into directional keys ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â both RustCrypto, both small, and
# `curve25519-dalek` is already in the tree via `ed25519-dalek`. Deliberately
# NOT a Noise framework: the pattern needed here is one round of signed
# ephemerals, and a framework would be more surface than protocol.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

[features]
# Writes `src/bindings.ts` on `cargo test --features generate-bindings`.
generate-bindings = []
# The developer helper binaries. Off by default so a release bundle carries
# the app and nothing else.
dev-bins = []
